  function triggerMoveAnimation(from, to, unitData, callback){
    flyingUnits.push({
      fromQ: from.q, fromR: from.r,
      toQ: to.q, toR: to.r,
      owner: unitData.owner,
      strength: unitData.strength,
      progress: 0,
    });
    
    const startTime = performance.now();
    const duration = 280;

    function animateStep(currentTime){
      const elapsed = currentTime - startTime;
      const p = Math.min(1, elapsed / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      
      if(flyingUnits.length > 0) flyingUnits[flyingUnits.length - 1].progress = eased;
      render();

      if(p < 1){
        requestAnimationFrame(animateStep);
      } else {
        flyingUnits.pop();
        if(callback) callback();
      }
    }
    requestAnimationFrame(animateStep);
  }

  function triggerDestructionAnimation(hex, unitData, callback){
    destroyingUnits.push({
      q: hex.q, r: hex.r,
      owner: unitData.owner,
      strength: unitData.strength,
      progress: 0
    });

    const startTime = performance.now();
    const duration = 380;

    function animateStep(currentTime){
      const elapsed = currentTime - startTime;
      const p = Math.min(1, elapsed / duration);
      
      if(destroyingUnits.length > 0) destroyingUnits[destroyingUnits.length - 1].progress = p;
      render();

      if(p < 1){
        requestAnimationFrame(animateStep);
      } else {
        destroyingUnits.pop();
        if(callback) callback();
      }
    }
    requestAnimationFrame(animateStep);
  }

  // Combat/movement resolution — exposed as Game.Combat.moveOrAttack.
  function moveOrAttack(from, to, actingPlayer, skipAnim = false, cb){
    const TERRAIN = getTerrainDefs();
    if(TERRAIN[to.terrain].impassable) return false;
    if(!from.unit || from.unit.owner!==actingPlayer || from.unit.hasMoved) return false;

    const unitCopy = { ...from.unit };
    from.unit = null;

    if(from.occupiedBy === actingPlayer){
      from.occupiedBy = null;
      logMsg(`Оккупация с клетки (${from.q}, ${from.r}) снята ввиду отступления.`);
    }

    if(to.owner === actingPlayer && to.unit !== null && to.unit.owner === actingPlayer){
      if(!skipAnim){
        triggerMoveAnimation(from, to, unitCopy, ()=>{
          to.unit.strength += unitCopy.strength;
          to.unit.hasMoved = true;
          if(to.occupiedBy !== null) to.occupiedBy = null;
          playSound('recruit');
          if(cb) cb('merged');
        });
      } else {
        to.unit.strength += unitCopy.strength;
        to.unit.hasMoved = true;
        if(to.occupiedBy !== null) to.occupiedBy = null;
        if(cb) cb('merged');
      }
      return 'merged';
    }

    if(to.unit !== null && to.unit.owner !== actingPlayer){
      const mockAttackerHex = { q: from.q, r: from.r, unit: unitCopy };
      const attData = getAttackerCombatData(mockAttackerHex, to, actingPlayer);
      const def = getDefenderCombatData(to, mockAttackerHex, to.unit.owner);
      const winner = attData.total > def.total;

      playSound('combat');

      const resolveCaptureOutcome = ()=>{
        to.unit = unitCopy;
        to.unit.hasMoved = true;
        let outcome = 'captured';
        if(to.owner === null){
          to.occupiedBy = actingPlayer;
          outcome = 'neutral_siege';
        } else if(to.owner === actingPlayer){
          to.occupiedBy = null;
        } else if(to.capital){
          to.occupiedBy = actingPlayer;
        } else {
          to.occupiedBy = actingPlayer;
          applyRaidLoot(to, actingPlayer);
          outcome = 'raided';
        }
        return outcome;
      };

      if(!skipAnim){
        triggerMoveAnimation(from, to, unitCopy, ()=>{
          if(winner){
            const outcome = resolveCaptureOutcome();
            if(cb) cb(outcome);
          } else {
            triggerDestructionAnimation(to, unitCopy, ()=>{
              if(cb) cb('lost');
            });
          }
        });
      } else {
        if(winner){
          return resolveCaptureOutcome();
        } else {
          return 'lost';
        }
      }
      return 'animating';
    }

    if(to.unit === null){
      const resolveMoveOutcome = ()=>{
        to.unit = unitCopy;
        to.unit.hasMoved = true;
        let outcome;
        if(to.owner === null){
          to.occupiedBy = actingPlayer;
          to.siegeTurnCount = 0;
          outcome = 'neutral_siege';
        } else if(to.owner === actingPlayer){
          to.occupiedBy = null;
          to.siegeTurnCount = 0;
          outcome = 'friendly';
        } else if(to.capital){
          to.occupiedBy = actingPlayer;
          to.siegeTurnCount = 0;
          outcome = 'occupied';
        } else {
          to.occupiedBy = actingPlayer;
          applyRaidLoot(to, actingPlayer);
          outcome = 'raided';
        }
        return outcome;
      };

      if(!skipAnim){
        triggerMoveAnimation(from, to, unitCopy, ()=>{
          const outcome = resolveMoveOutcome();
          playSound(outcome === 'occupied' || outcome === 'neutral_siege' ? 'occupy' : (outcome === 'raided' ? 'occupy' : 'move'));
          if(cb) cb(outcome);
        });
      } else {
        return resolveMoveOutcome();
      }
      return 'animating';
    }

    return false;
  }

  // ---------------------------------------------------------------------
  // Game.Input — translates clicks/hover into selection & orders.
  // ---------------------------------------------------------------------
  function selectHex(h){
    if(game.over) return;
    playSound('click');
    const prevSelected = game.selected;

    if(prevSelected === h && h && h.capital && h.unit && h.unit.owner === 0){
      h.unitHasFocus = !h.unitHasFocus;
      activeRegionId = h.unitHasFocus ? null : h.regionId;
      render(); updatePanel();
      return;
    }

    if(prevSelected && prevSelected.unit && prevSelected.unit.owner === 0 && !prevSelected.unit.hasMoved && prevSelected !== h){
      const isArmyFocused = !prevSelected.capital || prevSelected.unitHasFocus;
      if (isArmyFocused) {
        const reachable = getReachableHexes(prevSelected, 0);
        if(reachable.has(key(h.q, h.r))){
          moveOrAttack(prevSelected, h, 0, false, (result)=>{
            if(result === 'captured'){
              logMsg(`Победа в бою на (${h.q}, ${h.r})! Враг разбит.`);
            } else if(result === 'raided'){
              logMsg(`Рейд на (${h.q}, ${h.r}) удался — враг разбит.`);
            } else if(result === 'lost'){
              logMsg(`Атака на (${h.q}, ${h.r}) провалилась. Наш отряд уничтожен.`);
            } else if(result === 'merged'){
              logMsg(`Отряды объединены на (${h.q}, ${h.r}).`);
            } else if(result === 'neutral_siege'){
              logMsg(`Отряд вошел в нейтральную область (${h.q}, ${h.r}). Захват завершится на следующий ход.`);
            } else if(result === 'occupied'){
              logMsg(`Отряд начал ОСАДУ вражеской СТОЛИЦЫ (${h.q}, ${h.r}).`);
            }
            game.selected = null;
            activeRegionId = null;
            render(); updatePanel(); checkGameOver();
          });
          game.selected = null;
          activeRegionId = null;
          render(); updatePanel();
          return;
        }
      }
    }

    if(h && h.capital && h.unit && h.unit.owner === 0){
      game.selected = h;
      h.unitHasFocus = false;
      activeRegionId = h.regionId;
      render(); updatePanel();
      return;
    }

    if(h && h.unit && h.unit.owner === 0){
      game.selected = h;
      h.unitHasFocus = true;
      activeRegionId = null;
      render(); updatePanel();
      return;
    }

    if(h && h.capital && h.owner === 0){
      if(prevSelected === h){
        game.selected = null;
        activeRegionId = null;
      } else {
        game.selected = h;
        activeRegionId = h.regionId;
      }
      render(); updatePanel();
      return;
    }

    if(prevSelected === h){
      game.selected = null;
      activeRegionId = null;
    } else {
      game.selected = h;
      activeRegionId = h ? h.regionId : null;
    }
    render(); updatePanel();
  }

  // ---------------------------------------------------------------------
  // Game.Turns / Game.AI — turn flow (upkeep, income, siege resolution)
  // and the opponent AI. Untouched simulation logic, exposed as facades.
  // ---------------------------------------------------------------------
  function startPlayerTurn(pid){
    game.hexes.forEach(h => {
      if(!h.capital || h.occupiedBy === null) return;
      
      const isOccupiedByPid = (h.occupiedBy === pid);
      const isNeutralCapital = (h.owner === null);

      if(isOccupiedByPid) {
        const occupierPid = h.occupiedBy;
        const hasFriendlyUnit = (h.unit && h.unit.owner === occupierPid);

        if(hasFriendlyUnit){
          if(h.siegeTurnCount === undefined) h.siegeTurnCount = 0;
          h.siegeTurnCount++;
          
          if(h.siegeTurnCount >= 1){
            h.owner = occupierPid;
            h.occupiedBy = null;
            h.siegeTurnCount = 0;
            if(isNeutralCapital){
              logMsg(`🏳️ Нейтральная область #${h.regionId} полностью покорена фракцией «${game.players[occupierPid].name}»!`);
            } else {
              logMsg(`👑 Фракция «${game.players[occupierPid].name}» ЗАХВАТИЛА СТОЛИЦУ (${h.q}, ${h.r})! Вся область переходит под контроль.`);
            }
            claimRegionAllHexes(h.regionId, occupierPid);
          }
        } else {
          if(!isNeutralCapital){
            h.occupiedBy = null;
            h.siegeTurnCount = 0;
            logMsg(`Осада столицы (${h.q}, ${h.r}) снята в начале хода.`);
          } else if(h.unit && h.unit.owner !== occupierPid){
            h.occupiedBy = null;
            h.siegeTurnCount = 0;
          }
        }
      }
    });

    game.hexes.forEach(h => {
      if(h.occupiedBy !== null && h.owner !== null && h.capital && h.owner !== h.occupiedBy){
        if(!(h.unit && h.unit.owner === h.occupiedBy)){
          h.occupiedBy = null;
          h.siegeTurnCount = 0;
        }
      }
    });

    game.hexes.forEach(h => {
      if(h.unit && h.unit.owner === pid){
        h.unit.hasMoved = false;
      }
    });

    const p = game.players[pid];
    if(p.alive){
      const stats = getPlayerIncomeAndUpkeep(pid);
      p.gold += stats.net;
      if(p.gold < 0) {
        p.gold = 0;
        logMsg(`⚠️ У фракции «${p.name}» финансовый кризис! Доходы (${stats.income}💰) не покрывают содержание войск (-${stats.upkeep}💰).`);
      } else {
        logMsg(`📊 Фракция «${p.name}»: доход ${stats.income}💰, содержание войск -${stats.upkeep}💰 (итого: ${stats.net >= 0 ? '+' : ''}${stats.net}💰).`);
      }
    }
  }

  function startAiTurnSequence(){
    if(game.over || isAiRunning) return;
    isAiRunning = true;
    game.selected = null;
    activeRegionId = null;
    updatePanel();
    logMsg(`Ход противников... ИИ совершает манёвры.`);

    let aiFactions = [];
    for(let pid=1; pid<game.players.length; pid++){
      if(game.players[pid].alive) aiFactions.push(pid);
    }

    function runNextAi(index){
      if(index >= aiFactions.length){
        finalizeTurnCycle();
        return;
      }
      const pid = aiFactions[index];
      startPlayerTurn(pid);
      runSingleAiFaction(pid, ()=>{
        setTimeout(()=>{
          runNextAi(index + 1);
        }, 120);
      });
    }

    setTimeout(()=>{
      runNextAi(0);
    }, 200);
  }

  function runSingleAiFaction(pid, onDone){
    const p = game.players[pid];
    if(!p.alive || !p.gold){
      if(onDone) onDone();
      return;
    }
    const all = Array.from(game.hexes.values());

    const emptyOwnedCapitals = all.filter(h => h.owner === pid && h.capital && !h.unit && h.occupiedBy === null && !isRegionOccupiedBy(h.regionId, pid));
    let recruits = 0;
    for(let i=0; i<emptyOwnedCapitals.length && recruits < 2 && p.gold >= RECRUIT_COST; i++){
      const h = emptyOwnedCapitals[i];
      p.gold -= RECRUIT_COST;
      h.unit = { owner: pid, strength: INITIAL_STRENGTH, hasMoved: true };
      recruits++;
    }

    const aiUnits = all.filter(h => h.unit && h.unit.owner === pid && !h.unit.hasMoved);
    if(aiUnits.length === 0){
      if(onDone) onDone();
      return;
    }

    let unitIdx = 0;
    const maxIterationsPerFaction = 40;
    let iterations = 0;
    let consecutiveIdle = 0;
    
    const aiTimeoutGuard = setTimeout(() => {
      if(onDone) onDone();
    }, 2500);

    function processNextUnit(){
      if(unitIdx >= aiUnits.length || iterations >= maxIterationsPerFaction || consecutiveIdle > 10){
        clearTimeout(aiTimeoutGuard);
        if(onDone) onDone();
        return;
      }
      iterations++;
      const h = aiUnits[unitIdx++];
      if(!h || !h.unit || h.unit.hasMoved){
        consecutiveIdle++;
        processNextUnit();
        return;
      }
      consecutiveIdle = 0;

      const reachable = getReachableHexes(h, pid); 
      let bestTarget = null;
      let bestScore = -999;

      reachable.forEach((cost, kStr)=>{
        const targetHex = game.hexes.get(kStr);
        if(!targetHex || targetHex === h) return;

        let score = 0;
        if(targetHex.unit && targetHex.unit.owner !== pid){
          const mockAttackerHex = { q: h.q, r: h.r, unit: h.unit };
          const att = getAttackerCombatData(mockAttackerHex, targetHex, pid);
          const def = getDefenderCombatData(targetHex, mockAttackerHex, targetHex.unit.owner);
          if(att.total > def.total){
            score += targetHex.capital ? 250 : 50;
          } else {
            return;
          }
        } else if(targetHex.owner === null){
          score += targetHex.capital ? 120 : 35;
        } else if(targetHex.owner !== pid){
          score += targetHex.capital ? 200 : 30;
        } else {
          score += 5;
        }

        if(score > bestScore){
          bestScore = score;
          bestTarget = targetHex;
        }
      });

      if(bestTarget){
        moveOrAttack(h, bestTarget, pid, false, (res)=>{
          if(bestTarget.capital && bestTarget.occupiedBy !== null){
            bestTarget.siegeTurnCount = 0;
          }
          setTimeout(processNextUnit, 35);
        });
      } else {
        h.unit.hasMoved = true;
        processNextUnit();
      }
    }
    processNextUnit();
  }

  function finalizeTurnCycle(){
    game.round++;
    startPlayerTurn(0);

    const roundLabel = document.getElementById('roundLabel');
    if(roundLabel) roundLabel.textContent = 'Ход ' + game.round;

    checkGameOver();
    isAiRunning = false;
    render(); updatePanel();
    logMsg(`Раунд ${game.round} начался. Ваши войска готовы к приказам.`);
  }

  function checkGameOver(){
    game.players.forEach(p=>{
      if(p.alive && ownedHexCount(p.id)===0) {
        p.alive = false;
        game.hexes.forEach(h => {
          if(h.unit && h.unit.owner === p.id){
            h.unit = null;
          }
          if(h.occupiedBy === p.id){
            h.occupiedBy = null;
          }
        });
        logMsg(`Фракция «${p.name}» выбыла из войны. Ее оставшиеся войска рассеялись.`);
      }
    });
    const alive = game.players.filter(p=>p.alive);
    if(!game.players[0].alive){
      endGame(false, 'Ваши владения захвачены. Королевство пало.');
    } else if(alive.length===1 && alive[0].id===0){
      playSound('victory');
      endGame(true, 'Все соперники разгромлены. Вы истинный правитель континента!');
    }
  }

  function endGame(won, text){
    game.over = true;
    const overlay = document.getElementById('overlay');
    if(overlay){
      overlay.style.display='flex';
      const titleEl = document.getElementById('overlayTitle');
      if(titleEl){
        titleEl.textContent = won ? 'Великая Победа' : 'Поражение';
        titleEl.style.color = won ? 'var(--gold)' : 'var(--danger)';
      }
      document.getElementById('overlayText').textContent = text;
    }
  }

  // ---------------------------------------------------------------------
  // Game.Render — canvas setup, hex<->pixel math and the draw loop.
  // Untouched (per request: the map's visual rendering is not to change).
  // ---------------------------------------------------------------------
  // ---------------------------------------------------------------------
  // Камера: перевод между "координатами буфера канваса" (то, что реально
  // приходит в клиентских событиях мыши/тача) и "мировыми" координатами
  // карты (в которых работают pixelForHex/projectFlatPoint). Один источник
  // истины для обоих направлений — рендер и хит-тест НИКОГДА не расходятся.
  // ---------------------------------------------------------------------
  function clientToBuffer(evt){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (evt.clientX - rect.left) * scaleX,
      y: (evt.clientY - rect.top) * scaleY
    };
  }
  function bufferToWorld(pt){
    return { x: (pt.x - camera.x) / camera.zoom, y: (pt.y - camera.y) / camera.zoom };
  }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  // Не даём карте полностью "улететь" за пределы экрана при панорамировании —
  // всегда оставляем хотя бы небольшой нахлёст карты с вьюпортом.
  function clampCamera(){
    if(!canvas || !mapPixelW || !mapPixelH) return;
    const mapW = mapPixelW * camera.zoom, mapH = mapPixelH * camera.zoom;
    const padX = Math.min(canvas.width * 0.4, 320);
    const padY = Math.min(canvas.height * 0.4, 320);
    let minX = canvas.width - mapW - padX, maxX = padX;
    if(minX > maxX){ const mid = (minX + maxX) / 2; minX = maxX = mid; }
    camera.x = clamp(camera.x, minX, maxX);
    let minY = canvas.height - mapH - padY, maxY = padY;
    if(minY > maxY){ const mid = (minY + maxY) / 2; minY = maxY = mid; }
    camera.y = clamp(camera.y, minY, maxY);
  }

  // Зум с фиксированной "опорной" точкой в координатах буфера канваса —
  // при масштабировании карта под этой точкой (например, под курсором) не
  // "уезжает" в сторону.
  function zoomBy(factor, anchorBuffer){
    if(!canvas) return;
    const anchor = anchorBuffer || { x: canvas.width / 2, y: canvas.height / 2 };
    const oldZoom = camera.zoom;
    const newZoom = clamp(oldZoom * factor, MIN_ZOOM, MAX_ZOOM);
    if(newZoom === oldZoom) return;
    camera.x = anchor.x - (anchor.x - camera.x) * (newZoom / oldZoom);
    camera.y = anchor.y - (anchor.y - camera.y) * (newZoom / oldZoom);
    camera.zoom = newZoom;
    clampCamera();
    render();
  }

  // Вписывает всю карту в текущий вьюпорт по центру — исходное положение
  // "птичьего полёта" и то, к чему возвращает кнопка ⤢.
  function fitCameraToMap(){
    if(!canvas || !mapPixelW || !mapPixelH) return;
    const margin = 0.92;
    const z = clamp(Math.min(canvas.width / mapPixelW, canvas.height / mapPixelH) * margin, MIN_ZOOM, MAX_ZOOM);
    camera.zoom = z;
    camera.x = (canvas.width - mapPixelW * z) / 2;
    camera.y = (canvas.height - mapPixelH * z) / 2;
  }

  // --- Панорамирование мышью/тачем (Pointer Events объединяют оба) --------
  const activePointers = new Map();
  let isPanning = false, didDrag = false;
  let panStartBuffer = null, panStartCamera = null, panStartClient = null;
  let pinchStartDist = 0, pinchStartZoom = 1, pinchStartMid = null, pinchStartCamera = null;

  function pointerDist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

  function onPointerDown(evt){
    canvas.setPointerCapture(evt.pointerId);
    activePointers.set(evt.pointerId, { x: evt.clientX, y: evt.clientY });

    if(activePointers.size === 1){
      isPanning = true;
      didDrag = false;
      panStartBuffer = clientToBuffer(evt);
      panStartCamera = { x: camera.x, y: camera.y };
      panStartClient = { x: evt.clientX, y: evt.clientY };
    } else if(activePointers.size === 2){
      isPanning = false;
      const pts = Array.from(activePointers.values());
      pinchStartDist = pointerDist(pts[0], pts[1]) || 1;
      pinchStartZoom = camera.zoom;
      pinchStartCamera = { x: camera.x, y: camera.y };
      pinchStartMid = clientToBuffer({ clientX: (pts[0].x + pts[1].x) / 2, clientY: (pts[0].y + pts[1].y) / 2 });
    }
  }

  function onPointerMove(evt){
    if(!activePointers.has(evt.pointerId)){
      onCanvasHover(evt);
      return;
    }
    activePointers.set(evt.pointerId, { x: evt.clientX, y: evt.clientY });

    if(activePointers.size >= 2){
      const pts = Array.from(activePointers.values());
      const dist = pointerDist(pts[0], pts[1]) || 1;
      const newZoom = clamp(pinchStartZoom * (dist / pinchStartDist), MIN_ZOOM, MAX_ZOOM);
      camera.x = pinchStartMid.x - (pinchStartMid.x - pinchStartCamera.x) * (newZoom / pinchStartZoom);
      camera.y = pinchStartMid.y - (pinchStartMid.y - pinchStartCamera.y) * (newZoom / pinchStartZoom);
      camera.zoom = newZoom;
      clampCamera();
      render();
      return;
    }

    if(isPanning && panStartBuffer){
      if(!didDrag && Math.hypot(evt.clientX - panStartClient.x, evt.clientY - panStartClient.y) > 4){
        didDrag = true;
        canvas.classList.add('dragging');
      }
      if(didDrag){
        const buf = clientToBuffer(evt);
        camera.x = panStartCamera.x + (buf.x - panStartBuffer.x);
        camera.y = panStartCamera.y + (buf.y - panStartBuffer.y);
        clampCamera();
        hoveredHex = null;
        render();
      }
    }
  }

  function onPointerUp(evt){
    const wasPanning = isPanning && activePointers.has(evt.pointerId);
    activePointers.delete(evt.pointerId);

    if(activePointers.size === 0){
      canvas.classList.remove('dragging');
      if(wasPanning && !didDrag){
        const h = hexAtEvent(evt);
        if(h) selectHex(h);
      }
      isPanning = false;
      panStartBuffer = null;
      didDrag = false;
    } else if(activePointers.size === 1){
      // Отпустили один из двух пальцев при щипке — переходим обратно в pan
      // от оставшегося пальца, без "скачка" камеры.
      const [remaining] = activePointers.values();
      isPanning = true;
      didDrag = true;
      panStartBuffer = clientToBuffer({ clientX: remaining.x, clientY: remaining.y });
      panStartCamera = { x: camera.x, y: camera.y };
      panStartClient = { x: remaining.x, y: remaining.y };
    }
  }

  // --- Клавиатурное панорамирование (WASD / стрелки) — довершает ощущение
  // "птичьего полёта" над картой для тех, кто предпочитает клавиатуру. -----
  const _panKeys = new Set();
  const PAN_KEY_MAP = { 'w':[0,-1], 'ц':[0,-1], 'arrowup':[0,-1], 's':[0,1], 'ы':[0,1], 'arrowdown':[0,1],
                         'a':[-1,0], 'ф':[-1,0], 'arrowleft':[-1,0], 'd':[1,0], 'в':[1,0], 'arrowright':[1,0] };
  let _panRafId = null;
  function keyPanStep(){
    if(_panKeys.size === 0){ _panRafId = null; return; }
    let dx = 0, dy = 0;
    _panKeys.forEach(k => { const v = PAN_KEY_MAP[k]; if(v){ dx += v[0]; dy += v[1]; } });
    if(dx || dy){
      const len = Math.hypot(dx, dy) || 1;
      const speed = 14 / camera.zoom * (canvas ? canvas.width / 1200 + 0.6 : 1);
      camera.x -= (dx / len) * speed;
      camera.y -= (dy / len) * speed;
      clampCamera();
      render();
    }
    _panRafId = requestAnimationFrame(keyPanStep);
  }
  function initCameraKeyboard(){
    window.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName || '').toLowerCase();
      if(tag === 'input' || tag === 'select' || tag === 'textarea') return;
      const k = e.key.toLowerCase();
      if(!PAN_KEY_MAP[k]) return;
      _panKeys.add(k);
      if(_panRafId === null) _panRafId = requestAnimationFrame(keyPanStep);
    });
    window.addEventListener('keyup', (e) => { _panKeys.delete(e.key.toLowerCase()); });
    window.addEventListener('blur', () => { _panKeys.clear(); });
  }

  function setupCanvas(){
    canvas = document.getElementById('board');

    if(!canvas) return;
    ctx = canvas.getContext('2d');

    staticMapCanvas = document.createElement('canvas');
    staticCtx = staticMapCanvas.getContext('2d');

    resizeCanvas();

    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    canvas.addEventListener('mouseleave', ()=>{
      if(activePointers.size > 0) return; // не сбрасываем hover прямо посреди drag/pinch
      hoveredHex = null;
      updateTooltipHTML(null);
      render();
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const buf = clientToBuffer(e);
      const zoomSpeed = 1.12;
      const factor = e.deltaY > 0 ? 1 / zoomSpeed : zoomSpeed;
      zoomBy(factor, buf);
    }, { passive: false });

    initCameraKeyboard();
  }

  function resizeCanvas(){
    if(!canvas || !game) return;
    const hexList = Array.from(game.hexes.values());
    const pts = hexList.map(h=>axialToPixel(h.q,h.r));
    const minX = Math.min(...pts.map(p=>p.x)) - hexSize * 1.6;
    const maxX = Math.max(...pts.map(p=>p.x)) + hexSize * 1.6;
    const minY = Math.min(...pts.map(p=>p.y)) - hexSize * 1.6;
    const maxY = Math.max(...pts.map(p=>p.y)) + hexSize * 1.6;

    canvas.dataset.offx = -minX;
    canvas.dataset.offy = -minY;

    // Мировые габариты карты (см. mapPixelW/mapPixelH) — независимы от
    // размера холста, который теперь всегда равен размеру вьюпорта.
    mapPixelW = maxX - minX;
    // Контент по вертикали сжимается на TILT_FACTOR внутри projectFlatPoint,
    // поэтому и мировую высоту карты уменьшаем на тот же множитель — иначе
    // снизу остаётся пустая полоса ровно в (1 - TILT_FACTOR) высоты карты.
    mapPixelH = (maxY - minY) * TILT_FACTOR;

    // Диапазон плоской Y — в ТОЙ ЖЕ системе координат (offset уже применён), что и
    // flatCenterForHex()/hexCornerFlat(), которыми пользуется projectFlatPoint().
    const flatYs = pts.map(p => p.y - minY);
    _persMinFlatY = Math.min(...flatYs);
    _persMaxFlatY = Math.max(...flatYs);
    _persRangeReady = true;

    // Канвас теперь — полноэкранный буфер (карта на весь экран), а не "холст
    // ровно по размеру карты": позиционирование/масштаб карты внутри него
    // задаёт camera-transform в render(). Буфер считаем в физических пикселях
    // (devicePixelRatio, но не выше 2x — экономим память/время на очень
    // больших картах и densely-pixel экранах).
    devicePixelRatioUsed = Math.min(window.devicePixelRatio || 1, 2);
    const viewW = canvas.clientWidth || window.innerWidth;
    const viewH = canvas.clientHeight || window.innerHeight;
    canvas.width = Math.max(1, Math.round(viewW * devicePixelRatioUsed));
    canvas.height = Math.max(1, Math.round(viewH * devicePixelRatioUsed));

    isStaticLayerDirty = true;
    fitCameraToMap();
  }
  function pixelForHex(h){
    // Центр гекса проецируется той же единой функцией, что и его углы
    // (projectFlatPoint) — гарантирует, что юниты/столицы/текст, которые
    // рисуются в pixelForHex-точке, остаются точно в центре перспективно
    // искажённого шестиугольника, а не "уезжают" относительно его формы.
    // Возвращаемая точка — в МИРОВЫХ координатах карты; экранные пиксели
    // получаются из неё через camera-transform, который ставит render().
    const c = flatCenterForHex(h);
    const proj = projectFlatPoint(c.x, c.y);
    return { x: proj.x, y: proj.y, hexSize: hexSize * proj.scale, scale: proj.scale };
  }

  function cubeRound(qf, rf){
    let xf = qf, zf = rf, yf = -xf - zf;
    let rx = Math.round(xf), ry = Math.round(yf), rz = Math.round(zf);
    const xDiff = Math.abs(rx-xf), yDiff = Math.abs(ry-yf), zDiff = Math.abs(rz-zf);
    if(xDiff > yDiff && xDiff > zDiff) rx = -ry-rz;
    else if(yDiff > zDiff) ry = -rx-rz;
    else rz = -rx-ry;
    return { q: rx, r: rz };
  }

  function hexAtEvent(evt){
    if(!canvas || !game) return null;
    // Клиентские координаты -> буфер канваса (учитывает CSS-масштаб/DPR) ->
    // мировые координаты карты (отменяет камеру: pan+zoom). Это ТОЧНОЕ
    // обращение той трансформации, что render() задаёт через ctx.setTransform,
    // так что попадание в гекс остаётся точным при любом зуме/сдвиге камеры.
    const world = bufferToWorld(clientToBuffer(evt));

    const offX = canvas.dataset.offx ? parseFloat(canvas.dataset.offx) : 0;
    const offY = canvas.dataset.offy ? parseFloat(canvas.dataset.offy) : 0;

    // pixelForHex ещё и сжимает X по перспективе (perspectiveScaleForFlatY),
    // а не только Y (TILT_FACTOR) — точное обратное преобразование зависело бы от
    // r искомого гекса, который мы как раз ищем. Поэтому: сперва грубая оценка
    // БЕЗ перспективы (ей достаточно точности, чтобы попасть в нужный гекс или его
    // соседа), а затем уточнение по РЕАЛЬНЫМ мировым координатам через pixelForHex —
    // так клики остаются точными даже на сильно "уехавших" по перспективе дальних рядах.
    const mx = world.x - offX;
    const my = world.y / TILT_FACTOR - offY;

    const qf = (Math.sqrt(3)/3 * mx - 1/3 * my) / hexSize;
    const rf = (2/3 * my) / hexSize;
    const { q, r } = cubeRound(qf, rf);

    let best = game.hexes.get(key(q,r)) || null;
    let bestD = best ? distSqScreen(best, world.x, world.y) : Infinity;
    for(const [dq,dr] of DIRS){
      const cand = game.hexes.get(key(q+dq, r+dr));
      if(!cand) continue;
      const d = distSqScreen(cand, world.x, world.y);
      if(d < bestD){ bestD = d; best = cand; }
    }
    if(!best || bestD > hexSize*hexSize*1.3) return null;
    return best;

    function distSqScreen(h, x, y){
      const p = pixelForHex(h);
      return (p.x-x)*(p.x-x) + (p.y-y)*(p.y-y);
    }
  }

  function updateTooltipHTML(h){
    const tip = document.getElementById('fixedTooltip');
    if(!tip) return;
    if(!h){
      tip.innerHTML = '<span style="color:var(--text-muted)">Наведите или выберите гекс для информации...</span>';
      return;
    }

    const TERRAIN = getTerrainDefs();
    const t = TERRAIN[h.terrain];
    let txt = t.impassable ? `<b>${t.label}</b>` : `<b>${t.label}</b> · Доход: ${h.occupiedBy!==null?0:t.yield}💰`;
    if(h.owner!==null) txt += ` · Владелец: ${game.players[h.owner].name}`;
    if(h.occupiedBy!==null) txt += h.capital
      ? ` <br><span style="color:#e2b753;">👑 ОСАДА СТОЛИЦЫ: ${game.players[h.occupiedBy].name}</span>`
      : ` <br><span style="color:#e2b753;">⚔️ РЕЙД: ${game.players[h.occupiedBy].name}</span>`;
    if(h.capital) txt += ' <br>👑 СТОЛИЦА ОБЛАСТИ';
    
    if(h.unit){
      const supp = getAdjacentSupport(h, h.unit.owner);
      txt += ` <br>🛡️ Отряд: сила ${h.unit.strength}${supp>0?` (+${supp} поддержка = ${h.unit.strength+supp})`:''}`;
      if(h.unit.hasMoved) txt += ' [ход завершён]';
    }

    const sel = game.selected;
    if(sel && sel.unit && sel.unit.owner===0 && !sel.unit.hasMoved && sel!==h && !t.impassable){
      const reachable = getReachableCached(sel, 0);
      if(reachable.has(key(h.q, h.r))){
        const attData = getAttackerCombatData(sel, h, 0);
        const defData = getDefenderCombatData(h, sel, h.unit ? h.unit.owner : (h.owner !== null ? h.owner : null));
        const win = attData.total > defData.total;
        
        txt += ` | <b style="color:${win?'#86efac':'#fca5a5'};">Атака: ${win?'ПОБЕДА':'ПОРАЖЕНИЕ'}</b><br>`;
        txt += `<span style="font-size:11px; color:var(--text-muted);">⚔️ Атк: ${attData.base} база`;
        if(attData.support > 0) txt += ` + ${attData.support} поддержка`;
        txt += ` = <b>${attData.total}</b> | 🛡️ Защ: ${defData.base} база`;
        if(defData.defBonus > 0) txt += ` + ${defData.defBonus} местность/столица`;
        if(defData.support > 0) txt += ` + ${defData.support} поддержка`;
        txt += ` = <b>${defData.total}</b></span>`;
      }
    }
    tip.innerHTML = txt;
  }

  let _lastHoverHex = undefined;
  let _lastHoverRenderVersion = -1;

  function onCanvasHover(evt){
    const h = hexAtEvent(evt);
    if(h === _lastHoverHex && renderVersion === _lastHoverRenderVersion) return;
    
    hoveredHex = h;
    updateTooltipHTML(h);
    render();
    _lastHoverHex = h; _lastHoverRenderVersion = renderVersion;
  }

  // Индексы верхних трёх углов гекса (i=5 — макушка, i=4/i=0 — верхние "плечи",
  // см. hexCornerFlat). Используются, чтобы приподнимать контур обрезки вверх и
  // пропускать нависающий арт (гора, крона дерева) поверх верхних соседей —
  // см. overflowTop в hexPath() и artOverflowTop в drawHexTerrain().
  const HEX_TOP_CORNER_INDICES = [4, 5, 0];

  // ВАЖНО: принимает сам гекс h (с .q,.r), а НЕ уже спроецированную точку p.
  // Каждый угол проецируется отдельно через projectedHexCorner(h,i), которая
  // внутри вызывает единую projectFlatPoint() от координат именно этого угла —
  // поэтому у соседних гексов общий угол всегда совпадает пиксель-в-пиксель
  // (щелей между рядами нет), а сам гекс перестаёт быть правильным
  // шестиугольником: верхние углы, будучи дальше от камеры, получают меньший
  // масштаб, чем нижние — визуально гекс сужается кверху, как и должно быть
  // при настоящем перспективном наклоне доски.
  function hexPath(h, targetCtx, overflowTop){
    targetCtx.beginPath();
    for(let i=0;i<6;i++){
      const c = projectedHexCorner(h, i);
      let cy = c.y;
      // Приподнимаем только верхние три угла — контур превращается из ровного
      // шестиугольника в шестиугольник с "домиком" сверху. Клип по бокам и снизу
      // остаётся строгим (соседи слева/справа/снизу не перекрываются), а сверху
      // появляется запас на overflowTop пикселей для нависающих деталей картинки.
      if(overflowTop && HEX_TOP_CORNER_INDICES.includes(i)) cy -= overflowTop;
      if(i===0) targetCtx.moveTo(c.x,cy); else targetCtx.lineTo(c.x,cy);
    }
    targetCtx.closePath();
  }

  function drawOccupiedHatch(h, colorStr){
    const p = pixelForHex(h);
    ctx.save();
    hexPath(h, ctx);
    ctx.clip();
    ctx.strokeStyle = colorStr;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.45;
    const sz = p.hexSize * 1.5;
    for(let x = p.x - sz; x <= p.x + sz; x += 6){
      ctx.beginPath();
      ctx.moveTo(x, p.y - sz);
      ctx.lineTo(x + sz, p.y + sz);
      ctx.stroke();
    }
    ctx.restore();
  }

  let renderVersion = 0;

  function drawHexTerrain(h){
    const TERRAIN = getTerrainDefs();
    const p = pixelForHex(h);
    const terrainType = h.terrain;
    const def = TERRAIN[terrainType];
    const variants = (_terrainImages[terrainType] || []).filter(Boolean);

    // Если для этого террейна загружены картинки — рисуем одну из них
    // (вариант выбирается стабильно по координатам гекса, см. pickTerrainVariant).
    if (variants.length) {
      const img = pickTerrainVariant(h, variants);

      // Насколько верх картинки может вылезти за пределы гекса вверх (в пикселях,
      // с учётом перспективного размера ИМЕННО этого гекса — p.hexSize).
      const overflowTop = (def.artOverflowTop || 0) * p.hexSize;

      staticCtx.save();
      hexPath(h, staticCtx, overflowTop); // контур гекса с "бугром" вверх под нависающий арт
      staticCtx.clip();                   // обрезаем по бокам/снизу строго, сверху — с запасом

      // Саму картинку рисуем увеличенной и сдвинутой вверх на overflowTop, чтобы то,
      // что нарисовано в её верхней части (вершина горы, кроны леса), физически
      // оказалось выше границы гекса и легло поверх верхнего соседа — отсюда и
      // ощущение глубины. Порядок отрисовки по рядам (см. hexesByDepth() и
      // updateStaticLayer()) гарантирует, что дальний сосед уже нарисован и корректно
      // перекрывается.
      //
      // Небольшой запас по ширине (PAD): контур клипа теперь настоящая трапеция —
      // нижние углы гекса физически ближе к камере и потому чуть крупнее, чем
      // p.hexSize (который посчитан по ЦЕНТРУ гекса). Без запаса низ картинки мог
      // бы не дотягивать до расширенных нижних углов и оставлять прозрачную щель.
      const PAD = 1.18;
      const size = p.hexSize * 2 * PAD;
      staticCtx.drawImage(img, p.x - size/2, p.y - size/2 - overflowTop, size, size + overflowTop);

      staticCtx.restore();
    } else {
      // Запасной вариант со сплошным цветом, если картинки нет
      hexPath(h, staticCtx);
      staticCtx.fillStyle = territoryFillMode ? getTerritoryColor(h) : def.color;
      staticCtx.fill();
    }
  }
  function drawRegionHighlight(h) {
    for(let i=0; i<6; i++){
      const [dq, dr] = EDGE_DIRS[i];
      const nb = game.hexes.get(key(h.q + dq, h.r + dr));
      if(!nb || nb.regionId !== h.regionId){
        const c1 = projectedHexCorner(h, i);
        const c2 = projectedHexCorner(h, (i+1)%6);
        staticCtx.beginPath();
        staticCtx.moveTo(c1.x, c1.y);
        staticCtx.lineTo(c2.x, c2.y);
        staticCtx.lineWidth = 0.9;
        staticCtx.strokeStyle = 'rgba(8, 14, 9, 0.35)';
        staticCtx.stroke();
      }
    }
  }
  function drawActiveRegion (h) {
    if(h.regionId === activeRegionId){
      hexPath(h, ctx);
      ctx.fillStyle = 'rgba(212, 162, 76, 0.22)';
      ctx.fill();
    }
  }
  function drawSiegeHatch (h) {
    if(h.capital){
      const regHexes = Array.from(game.hexes.values()).filter(x => x.regionId === h.regionId);
      regHexes.forEach(rh => {
        drawOccupiedHatch(rh, game.players[h.occupiedBy].color);
      });
    }
  }
  function drawReachable (h) {
    const enemyReachable = getReachableCached(h, h.unit.owner);
    enemyReachable.forEach((cost, kStr)=>{
      const n = game.hexes.get(kStr);
      if(!n) return;
      hexPath(n, ctx);
      ctx.fillStyle = 'rgba(239, 68, 68, 0.22)';
      ctx.fill();
    });
  }

  function drawPlayerReachable (h) {
    if(h.unit.hasMoved || !h.unitHasFocus) return;
    const reachable = getReachableCached(h, 0);
    reachable.forEach((cost, kStr)=>{
      if(kStr === key(h.q, h.r)) return;
      const n = game.hexes.get(kStr);
      if(!n) return;
      let fillStyle = 'rgba(59, 130, 246, 0.32)';
      let win = true;
      if(n.unit && n.unit.owner !== 0){
        const att = getAttackerCombatData(h, n, 0);
        const def = getDefenderCombatData(n, h, n.unit.owner);
        win = att.total > def.total;
        fillStyle = win ? 'rgba(74, 222, 128, 0.4)' : 'rgba(239, 68, 68, 0.4)';
      }
      hexPath(n, ctx);
      ctx.fillStyle = fillStyle;
      ctx.fill();
    });
  }
  
  function drawZoc (h) {
    const TERRAIN = getTerrainDefs();
    neighbors(h).forEach(nb => {
      if(!TERRAIN[nb.terrain].impassable){
        hexPath(nb, ctx);
        ctx.fillStyle = 'rgba(212,162,76,0.18)';
        ctx.fill();
      }
    });
  }
  function drawUnit (h) {
    const p = pixelForHex(h);
    const hs = p.hexSize; // размер юнита следует перспективному размеру его гекса
    const uColor = game.players[h.unit.owner].color;
    ctx.beginPath();
    ctx.arc(p.x, p.y + hs * 0.2, hs * 0.36, 0, Math.PI * 2);
    ctx.fillStyle = uColor;
    ctx.fill();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = '#101712';
    ctx.stroke();

    if(h.unit.hasMoved){
      ctx.beginPath();
      ctx.arc(p.x + hs * 0.22, p.y, 3 * p.scale, 0, Math.PI * 2);
      ctx.fillStyle = '#94a3b8';
      ctx.fill();
    }
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + Math.max(8, Math.round(11 * p.scale)) + 'px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(h.unit.strength, p.x, p.y + hs * 0.2);
  }
  function drawHexBorder(h){
    hexPath(h, staticCtx);
    staticCtx.lineWidth = 0.9;
    staticCtx.strokeStyle = 'rgba(0,0,0,0.32)';
    staticCtx.stroke();
  }
  function drawFactionBorders(h) {
    const color = game.players[h.owner].color;

    ctx.save();

    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const c = projectedHexCorner(h, i);
      if (i === 0) ctx.moveTo(c.x, c.y);
      else ctx.lineTo(c.x, c.y);
    }
    ctx.closePath();
    ctx.clip();

    const corners = [];
    for (let i = 0; i < 6; i++) {
      corners.push(projectedHexCorner(h, i));
    }

    ctx.lineWidth = 6 * camera.zoom;
    ctx.strokeStyle = color;
    ctx.lineCap = 'square'; 
    ctx.beginPath();

    let hasEdges = false;

    for (let i = 0; i < 6; i++) {
      const [dq, dr] = EDGE_DIRS[i];
      const nb = game.hexes.get(key(h.q + dq, h.r + dr));
      
      if (!nb || nb.owner !== h.owner) {
        let c1 = corners[i];
        let c2 = corners[(i + 1) % 6];

        // 4. Удлиняем каждый отрезок в обе стороны, чтобы они заходили друг за друга на углах
        const dx = c2.x - c1.x;
        const dy = c2.y - c1.y;
        const len = Math.sqrt(dx * dx + dy * dy);
        
        if (len > 0) {
          const extend = 4 * camera.zoom; // Запас на перекрытие стыка
          const ux = (dx / len) * extend;
          const uy = (dy / len) * extend;

          c1 = { x: c1.x - ux, y: c1.y - uy };
          c2 = { x: c2.x + ux, y: c2.y + uy };
        }

        ctx.moveTo(c1.x, c1.y);
        ctx.lineTo(c2.x, c2.y);
        hasEdges = true;
      }
    }

    if (hasEdges) {
      ctx.stroke();
    }

    ctx.restore();
  }
  function drawCapital(h){
    const p = pixelForHex(h);
    staticCtx.beginPath();
    staticCtx.arc(p.x, p.y - p.hexSize * 0.38, 3.5 * p.scale, 0, Math.PI * 2);
    staticCtx.fillStyle = h.owner !== null ? game.players[h.owner].color : '#d4a24c';
    staticCtx.fill();
    staticCtx.lineWidth = 1.5;
    staticCtx.strokeStyle = '#101712';
    staticCtx.stroke();
  }
  function drawSelected(h){
    hexPath(h, ctx);
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = '#f4eedb';
    ctx.stroke();
  }
  function drawHovered(h){
    hexPath(h, ctx);
    ctx.fillStyle = 'rgba(255,255,255,0.32)';
    ctx.fill();
  }

  function drawFlyingUnits(){
    const offX = canvas.dataset.offx ? parseFloat(canvas.dataset.offx) : 0;
    const offY = canvas.dataset.offy ? parseFloat(canvas.dataset.offy) : 0;

    flyingUnits.forEach(fu => {
      const fromP = axialToPixel(fu.fromQ, fu.fromR);
      const toP = axialToPixel(fu.toQ, fu.toR);

      // Интерполируем в ПЛОСКИХ (до наклона/перспективы) координатах — ровно
      // так же, как это делает hexCornerFlat()/flatCenterForHex() для
      // статичных гексов — и лишь затем проецируем через ЕДИНУЮ
      // projectFlatPoint(). Раньше здесь просто умножали на TILT_FACTOR и
      // игнорировали perspectiveScaleForFlatY(), поэтому летящий юнит двигался
      // по прямой, а не по той же перспективно-искажённой дуге, что рисуют
      // сами гексы — сейчас он "приезжает" точно в центр гекса-цели.
      const flatX = fromP.x + (toP.x - fromP.x) * fu.progress + offX;
      const flatY = fromP.y + (toP.y - fromP.y) * fu.progress + offY;
      const proj = projectFlatPoint(flatX, flatY);
      const r = hexSize * proj.scale;

      ctx.beginPath();
      ctx.arc(proj.x, proj.y, r * 0.38, 0, Math.PI * 2);
      ctx.fillStyle = game.players[fu.owner].color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold ' + Math.max(8, Math.round(11 * proj.scale)) + 'px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(fu.strength, proj.x, proj.y);
    });
  }
  function drawDestroyingUnits(){
    destroyingUnits.forEach(du => {
      const p = pixelForHex(du);
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - du.progress);
      ctx.beginPath();
      ctx.arc(p.x, p.y + p.hexSize * 0.2, p.hexSize * (0.36 + du.progress * 0.4), 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.fill();
      ctx.restore();
    });
  }

  function updateStaticLayer() {
    // Статический слой (террейн/сетка/границы регионов) рисуется ОДИН РАЗ в
    // мировых координатах карты (mapPixelW×mapPixelH), а не в размере
    // полноэкранного буфера канваса — camera-transform в render() сам
    // растягивает/двигает этот слой на экран через drawImage(staticMapCanvas).
    staticMapCanvas.width = Math.max(1, Math.ceil(mapPixelW));
    staticMapCanvas.height = Math.max(1, Math.ceil(mapPixelH));
    staticCtx.clearRect(0, 0, staticMapCanvas.width, staticMapCanvas.height);
    // ВАЖНО: рисуем в порядке "художника" — дальние ряды (меньший r) раньше ближних
    // (больший r), см. hexesByDepth(). game.hexes.forEach() отдаёт хексы в порядке
    // вставки (по q, затем r), что раньше было не важно, но теперь картинка одного
    // гекса может специально вылезать вверх за его границы (artOverflowTop) и должна
    // ложиться ПОВЕРХ уже нарисованного дальнего соседа — иначе глубина не сработает
    // или сработает наоборот.
    hexesByDepth().forEach(h => {
      drawHexTerrain(h);
      if(h.regionId !== null) drawRegionHighlight(h);
      if (showGrid) drawHexBorder(h);
    });
    isStaticLayerDirty = false;
  }

  // game.hexes — это Map, обходится в порядке вставки (создаётся по q, затем r —
  // см. newGame), а не в порядке "глубины" сцены. Пока тилта не было, порядок
  // отрисовки был не важен: гексы не перекрывали друг друга. С наклоном же юниты,
  // столицы и т.п. могут визуально выходить за пределы своего гекса и должны
  // рисоваться по правилу художника — сначала дальние (меньший r), затем ближние
  // (больший r), чтобы близкие перекрывали дальние, а не наоборот.
  // y в axialToPixel зависит только от r, так что сортировки по r достаточно.
  function hexesByDepth(){
    return Array.from(game.hexes.values()).sort((a,b)=> a.r - b.r);
  }
  function render(){
    if(!ctx || !canvas) return;
    renderVersion++;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.resetTransform();
    ctx.setTransform(camera.zoom, 0, 0, camera.zoom, camera.x, camera.y);

    // Layer: static (террейн/сетка/границы регионов, кэшируются в staticMapCanvas)
    if (isStaticLayerDirty) updateStaticLayer();
    ctx.drawImage(staticMapCanvas, 0, 0);

    const depthOrder = hexesByDepth();

    // Layer 0: границы фракций, подсветка активной области, штриховка осады
    depthOrder.forEach(h=>{
      if(h.owner !== null) drawFactionBorders(h) 
      if (activeRegionId !== null) drawActiveRegion(h);
      if (h.occupiedBy !== null) drawSiegeHatch(h);
    });

    //Layer 1
    const hh = hoveredHex;
    const sh = game.selected;

    if(hh){
      drawHovered(hh)
      if(hh.unit && hh.unit.owner !== 0) drawReachable(hh)
      //if(hh.unit && zocEnabled) drawZoc(hh)
    }
    if(sh){
      drawSelected(sh)
      if(sh.unit && sh.unit.owner===0 && !game.over) drawPlayerReachable(sh)
    }
    //Layer 2
    depthOrder.forEach(h => {
      if (h.unit) drawUnit(h);
      if(h.capital) drawCapital(h);
    });

    drawFlyingUnits();
    drawDestroyingUnits();
    ctx.resetTransform();
  }

  // ---------------------------------------------------------------------
  // Game.UI — side panel rendering (player list, selection card, action
  // buttons) and top-level DOM event wiring. This is the layer this pass
  // focuses on improving visually; exposed as Game.UI below.
  // ---------------------------------------------------------------------
  function updatePanel(){
    const pList = document.getElementById('playerList');
    if(pList){
      pList.innerHTML = game.players.map(p => {
        const stats = getPlayerIncomeAndUpkeep(p.id);
        return `
        <div class="playerRow ${!p.alive ? 'dead' : ''} ${p.id===0 ? 'activePlayer' : ''}">
          <div class="swatch" style="background:${p.color}"></div>
          <div class="playerName">${p.name} <span style="font-size:10px; color:var(--text-muted); display:block;">Доход: +${stats.income} | Расх: -${stats.upkeep}</span></div>
          <div class="playerGold">${p.gold}💰 (${(stats.income - stats.upkeep)})</div>
          <div class="playerHexes">${ownedHexCount(p.id)} г.</div>
        </div>
      `;
      }).join('');
    }

    const info = document.getElementById('selectedInfo');
    const acts = document.getElementById('actionButtons');
    if(!info || !acts) return;

    const sel = game.selected;
    if(!sel){
      info.innerHTML = '<span class="placeholder">Выберите гекс для отдачи приказов</span>';
      acts.innerHTML = '';
      return;
    }

    const TERRAIN = getTerrainDefs();
    const t = TERRAIN[sel.terrain];
    let html = `<b>${t.label}</b> (q:${sel.q}, r:${sel.r})`;
    if(sel.owner!==null) html += `<br>Владелец: ${game.players[sel.owner].name}`;
    if(sel.capital) html += `<br><span style="color:var(--gold);">👑 Столица области #${sel.regionId}</span>`;
    
    let actHtml = '';
    if(sel.unit){
      html += `<br><span style="color:#60a5fa;">🛡️ Отряд фракции ${game.players[sel.unit.owner].name} (сила: ${sel.unit.strength})</span>`;
    }
    info.innerHTML = html;

    const regionIsOccupied = isRegionOccupiedBy(sel.regionId, 0);

    if(sel.capital && sel.unit && sel.unit.owner === 0){
      actHtml += `<div style="background:rgba(212,162,76,0.08); border:1px solid var(--gold-dim); padding:8px; border-radius:4px; margin-bottom:8px;">
        <div style="font-size:11px; color:var(--gold); margin-bottom:6px; font-weight:bold; text-transform:uppercase;">Выбрать объект на гексе:</div>
        <div style="display:flex; gap:6px;">
          <button id="selectCapitalBtn" type="button" style="margin-top:0; flex:1; font-size:11px; background:${!sel.unitHasFocus ? 'var(--gold)' : 'transparent'}; color:${!sel.unitHasFocus ? '#1b1305' : 'var(--gold)'};">Столица</button>
          <button id="selectArmyBtn" type="button" style="margin-top:0; flex:1; font-size:11px; background:${sel.unitHasFocus ? 'var(--gold)' : 'transparent'}; color:${sel.unitHasFocus ? '#1b1305' : 'var(--gold)'};">Войска</button>
        </div>
      </div>`;
    } else if(sel.capital && sel.unit && sel.unit.owner !== 0){
      actHtml += `<div style="font-size:11px; color:var(--text-muted); margin-bottom:6px;">Столица занята вражеским отрядом.</div>`;
    }

    const isCapitalFocused = sel.capital && sel.owner === 0 && (!sel.unit || !sel.unitHasFocus);
    if(isCapitalFocused && !game.over && sel.occupiedBy === null && !sel.unit){
      if(regionIsOccupied){
        actHtml += `<div style="font-size:11px; color:var(--danger); margin-top:6px; margin-bottom:6px;">⚠️ Область оккупирована! Найм войск заблокирован.</div>`;
      } else {
        actHtml += `<button id="recruitBtn" type="button">Найнять отряд (${RECRUIT_COST}💰)</button>`;
      }
    }
    
    const isUnitInCapital = sel.capital && sel.unit && sel.unit.owner === 0 && sel.owner === 0;
    if(isUnitInCapital && !game.over && game.players[0].gold >= REINFORCE_COST){
      if(regionIsOccupied){
        actHtml += `<div style="font-size:11px; color:var(--danger); margin-top:6px; margin-bottom:6px;">⚠️ Текущая область оккупирована! Усиление войск заблокировано.</div>`;
      } else {
        actHtml += `<button id="reinforceBtn" type="button">Усилить отряд (${REINFORCE_COST}💰)</button>`;
      }
    }
    acts.innerHTML = actHtml;

    const selCapBtn = document.getElementById('selectCapitalBtn');
    if(selCapBtn){
      selCapBtn.onclick = (e) => {
        e.stopPropagation();
        sel.unitHasFocus = false;
        activeRegionId = sel.regionId;
        render(); updatePanel();
      };
    }

    const selArmyBtn = document.getElementById('selectArmyBtn');
    if(selArmyBtn){
      selArmyBtn.onclick = (e) => {
        e.stopPropagation();
        sel.unitHasFocus = true;
        activeRegionId = null;
        render(); updatePanel();
      };
    }

    const recBtn = document.getElementById('recruitBtn');
    if(recBtn){
      recBtn.onclick = (e)=>{
        e.stopPropagation();
        if(game.players[0].gold >= RECRUIT_COST && !sel.unit && !isRegionOccupiedBy(sel.regionId, 0)){
          game.players[0].gold -= RECRUIT_COST;
          sel.unit = { owner: 0, strength: 1, hasMoved: true };
          playSound('recruit');
          logMsg(`Найман новый отряд на (${sel.q}, ${sel.r}) [ожидает следующего хода для движения].`);
          render(); updatePanel();
        }
      };
    }

    const reinBtn = document.getElementById('reinforceBtn');
    if(reinBtn){
      reinBtn.onclick = (e)=>{
        e.stopPropagation();
        if(game.players[0].gold >= REINFORCE_COST && sel.unit && sel.unit.owner===0 && !isRegionOccupiedBy(sel.regionId, 0)){
          game.players[0].gold -= REINFORCE_COST;
          sel.unit.strength += 1;
          playSound('recruit');
          logMsg(`Отряд на (${sel.q}, ${sel.r}) усилен.`);
          render(); updatePanel();
        }
      };
    }
  }

  function initUIEvents(){
    document.getElementById('newGameBtn').onclick = () => {
      newGame(Date.now());
      resizeCanvas();
      render();
      updatePanel();
    };
    document.getElementById('panelToggle').onclick = () => {
      document.getElementById('panel').classList.toggle("visible");
    };

    document.getElementById('zoomInBtn').onclick = () => zoomBy(1.25);
    document.getElementById('zoomOutBtn').onclick = () => zoomBy(0.8);
    document.getElementById('centerViewBtn').onclick = () => { fitCameraToMap(); render(); };

    document.getElementById('restartBtn').onclick = () => {
      document.getElementById('overlay').style.display='none';
      newGame(Date.now());
      resizeCanvas();
      render();
      updatePanel();
    };

    document.getElementById('audioToggleBtn').onclick = () => {
      const enabled = Game.Audio.toggle();
      document.getElementById('audioToggleBtn').textContent = enabled ? '🔊 Звук' : '🔇 Звук выкл';
    };

    document.getElementById('endTurnBtn').onclick = () => {
      if(game.over || isAiRunning) return;
      game.selected = null;
      activeRegionId = null;
      startAiTurnSequence();
    };

    document.getElementById('mapSizeSelect').onchange = (e) => {
      mapRadius = parseInt(e.target.value);
      newGame(Date.now());
      resizeCanvas();
      render();
      updatePanel();
    };

    document.getElementById('regionSizeSelect').onchange = (e) => {
      regionSizeMode = e.target.value;
      newGame(Date.now());
      resizeCanvas();
      render();
      updatePanel();
    };

    document.getElementById('moveRangeSelect').onchange = (e) => {
      maxMovementPoints = parseInt(e.target.value);
      render();
    };

    document.getElementById('hexSizeRange').oninput = (e) => {
      hexSize = parseInt(e.target.value);
      resizeCanvas();
      render();
    };

    document.getElementById('gridToggleCheck').onchange = (e) => {
      showGrid = e.target.checked;
      isStaticLayerDirty = true;
      render();
    };

    document.getElementById('territoryFillCheck').onchange = (e) => {
      territoryFillMode = e.target.checked;
      isStaticLayerDirty = true;
      render();
    };

    document.getElementById('factionsCountSelect').onchange = (e) => {
      factionsCount = parseInt(e.target.value);
      newGame(Date.now());
      resizeCanvas();
      render();
      updatePanel();
    };

    document.getElementById('themeSelect').onchange = (e) => {
      currentTheme = e.target.value;
      render();
    }; 

    document.getElementById('zocSelect').onchange = (e) => {
      zocEnabled = (e.target.value === 'on');
      render();
    };

    let _resizeDebounce = null;
    window.addEventListener('resize', () => {
      clearTimeout(_resizeDebounce);
      _resizeDebounce = setTimeout(() => {
        resizeCanvas();
        render();
      }, 80);
    });
  }

  // ==========================================================================
  // Public Game namespace — a professional, discoverable facade over the
  // engine above. Nothing here changes behaviour: every entry is a direct
  // reference to the exact same function/state that already existed, just
  // grouped by responsibility (map generation, combat math, AI, rendering,
  // turn flow, UI) instead of being one flat list of globals. This keeps the
  // battle-tested map/gameplay code completely untouched while giving the
  // codebase real structure, e.g. Game.Map.create(), Game.AI.runFaction(),
  // Game.Turns.checkGameOver(), Game.UI.updatePanel().
  // ==========================================================================
  Game.Config = {
    get hexSize(){ return hexSize; },
    get showGrid(){ return showGrid; },
    get territoryFillMode(){ return territoryFillMode; },
    get currentTheme(){ return currentTheme; },
    get zocEnabled(){ return zocEnabled; },
    get mapRadius(){ return mapRadius; },
    get maxMovementPoints(){ return maxMovementPoints; },
    get regionSizeMode(){ return regionSizeMode; },
    get factionsCount(){ return factionsCount; },
    THEMES, RECRUIT_COST, REINFORCE_COST, INITIAL_STRENGTH,
    CAPITAL_BONUS_GOLD, CAPITAL_BONUS_DEFENSE,
    terrainDefs: getTerrainDefs
  };

  Game.State = {
    get current(){ return game; },
    get selected(){ return game ? game.selected : null; },
    get isAiRunning(){ return isAiRunning; },
    get camera(){ return camera; }
  };

  Game.Map = {
    create: newGame,
    neighbors,
    claimRegion: claimRegionAllHexes,
    ownedHexCount,
    incomeAndUpkeep: getPlayerIncomeAndUpkeep,
    isRegionOccupiedBy,
    applyRaidLoot
  };

  Game.Movement = {
    inEnemyZoC,
    reachable: getReachableHexes,
    reachableCached: getReachableCached
  };

  Game.Combat = {
    adjacentSupport: getAdjacentSupport,
    attackerData: getAttackerCombatData,
    defenderData: getDefenderCombatData,
    moveOrAttack
  };

  Game.Turns = {
    startPlayerTurn,
    finalizeTurnCycle,
    checkGameOver,
    endGame
  };

  Game.AI = {
    runTurnSequence: startAiTurnSequence,
    runFaction: runSingleAiFaction
  };

  Game.Render = {
    setup: setupCanvas,
    resize: resizeCanvas,
    draw: render,
    pixelForHex,
    hexAtEvent,
    zoomBy,
    fitCameraToMap
  };

  Game.Input = {
    selectHex,
    onCanvasHover,
    onPointerDown,
    onPointerMove,
    onPointerUp
  };

  Game.UI = {
    updatePanel,
    updateTooltip: updateTooltipHTML,
    updateLegend: updateLegendDOM,
    log: logMsg,
    initEvents: initUIEvents
  };

  window.onload = function(){
    loadTerrainAssets(() => {
      initUIEvents();
      newGame(12345);
      setupCanvas();
      render();
      updatePanel();
    });
  };

})();
</script>
