    if (variants.length) {
      const img = Game.Config.terrainVariant(h, variants);

      // Насколько верх картинки может вылезти за пределы гекса вверх — см.
      // подробности в комментарии выше про overflowTop/hexPath (тот же
      // приём, что и для патернов: рисуем крупнее и сдвигаем вверх, чтобы
      // вершины/кроны легли поверх верхнего соседа).
      Game.Render.drawHexImage(h, img, overflowTop);
    } else {
      // 3) Совсем запасной вариант со сплошным цветом, если картинки нет вообще
      Game.Render.hexPath(h, Game.Render.staticCtx);
      Game.Render.staticCtx.fillStyle = Game.Config.settings.territoryFillMode ? Game.Render.territoryColor(h, def.color) : def.color;
      Game.Render.staticCtx.fill();
    }
  };
  Game.Render.drawRegionHighlight = function drawRegionHighlight(h) {
    for(let i=0; i<6; i++){
      const [dq, dr] = Game.Config.EDGE_DIRS[i];
      const nb = Game.State.match.hexes.get(Game.Utils.key(h.q + dq, h.r + dr));
      if(!nb || nb.regionId !== h.regionId){
        const c1 = Game.Render.corner(h, i);
        const c2 = Game.Render.corner(h, (i+1)%6);
        Game.Render.staticCtx.beginPath();
        Game.Render.staticCtx.moveTo(c1.x, c1.y);
        Game.Render.staticCtx.lineTo(c2.x, c2.y);
        Game.Render.staticCtx.lineWidth = 0.9;
        Game.Render.staticCtx.strokeStyle = 'rgba(8, 14, 9, 0.35)';
        Game.Render.staticCtx.stroke();
      }
    }
  };
  Game.Render.drawActiveRegion = function drawActiveRegion(h) {
    if(h.regionId === Game.State.activeRegionId){
      Game.Render.hexPath(h, Game.Render.ctx);
      Game.Render.ctx.fillStyle = 'rgba(212, 162, 76, 0.22)';
      Game.Render.ctx.fill();
    }
  };
  Game.Render.drawSiegeHatch = function drawSiegeHatch(h) {
    if(h.capital){
      const regHexes = Array.from(Game.State.match.hexes.values()).filter(x => x.regionId === h.regionId);
      regHexes.forEach(rh => {
        Game.Render.drawOccupiedHatch(rh, Game.State.match.players[h.occupiedBy].color);
      });
    }
  };
  Game.Render.drawReachable = function drawReachable(h) {
    const enemyReachable = Game.Movement.reachableCached(h, h.unit.owner);
    enemyReachable.forEach((cost, kStr)=>{
      const n = Game.State.match.hexes.get(kStr);
      if(!n) return;
      Game.Render.hexPath(n, Game.Render.ctx);
      Game.Render.ctx.fillStyle = 'rgba(239, 68, 68, 0.22)';
      Game.Render.ctx.fill();
    });
  };
  Game.Render.drawPlayerReachable = function drawPlayerReachable(h) {
    if(h.unit.hasMoved || !h.unitHasFocus) return;
    const reachable = Game.Movement.reachableCached(h, 0);
    reachable.forEach((cost, kStr)=>{
      if(kStr === Game.Utils.key(h.q, h.r)) return;
      const n = Game.State.match.hexes.get(kStr);
      if(!n) return;
      let fillStyle = 'rgba(59, 130, 246, 0.32)';
      let win = true;
      if(n.unit && n.unit.owner !== 0){
        const att = Game.Combat.attackerData(h, n, 0);
        const def = Game.Combat.defenderData(n, h, n.unit.owner);
        win = att.total > def.total;
        fillStyle = win ? 'rgba(74, 222, 128, 0.4)' : 'rgba(239, 68, 68, 0.4)';
      }
      Game.Render.hexPath(n, Game.Render.ctx);
      Game.Render.ctx.fillStyle = fillStyle;
      Game.Render.ctx.fill();
    });
  };
  Game.Render.drawZoc = function drawZoc(h) {
    const TERRAIN = Game.Config.terrainDefs();
    Game.Map.neighbors(h).forEach(nb => {
      if(!TERRAIN[nb.terrain].impassable){
        Game.Render.hexPath(nb, Game.Render.ctx);
        Game.Render.ctx.fillStyle = 'rgba(212,162,76,0.18)';
        Game.Render.ctx.fill();
      }
    });
  };
  Game.Render.drawUnit = function drawUnit(h) {
    const p = Game.Render.pixelForHex(h);
    const hs = p.hexSize; // размер юнита следует перспективному размеру его гекса
    const uColor = Game.State.match.players[h.unit.owner].color;
    const cx = p.x, cy = p.y + hs * 0.2, r = hs * 0.36;
    const img = Game.Assets.variant('unit', 'default', h);

    // Цветной кружок фракции — рисуем всегда (и без картинки, и под ней),
    // чтобы принадлежность юнита было видно с первого взгляда независимо от
    // того, положили вы уже арт для юнитов или ещё нет.
    Game.Render.ctx.beginPath();
    Game.Render.ctx.arc(cx, cy, r, 0, Math.PI * 2);
    Game.Render.ctx.fillStyle = uColor;
    Game.Render.ctx.fill();
    Game.Render.ctx.lineWidth = 1.8;
    Game.Render.ctx.strokeStyle = '#101712';
    Game.Render.ctx.stroke();

    if(img){
      const size = r * 1.7;
      Game.Render.ctx.save();
      Game.Render.ctx.beginPath();
      Game.Render.ctx.arc(cx, cy, r, 0, Math.PI * 2);
      Game.Render.ctx.clip();
      Game.Render.ctx.drawImage(img, cx - size / 2, cy - size / 2, size, size);
      Game.Render.ctx.restore();
    }

    if(h.unit.hasMoved){
      Game.Render.ctx.beginPath();
      Game.Render.ctx.arc(p.x + hs * 0.22, p.y, 3 * p.scale, 0, Math.PI * 2);
      Game.Render.ctx.fillStyle = '#94a3b8';
      Game.Render.ctx.fill();
    }
    Game.Render.ctx.fillStyle = '#ffffff';
    Game.Render.ctx.font = 'bold ' + Math.max(8, Math.round(11 * p.scale)) + 'px ' + getComputedStyle(document.body).fontFamily;
    Game.Render.ctx.textAlign = 'center';
    Game.Render.ctx.textBaseline = 'middle';
    Game.Render.ctx.fillText(h.unit.strength, p.x, p.y + hs * 0.2);
  };
  Game.Render.drawHexBorder = function drawHexBorder(h){
    Game.Render.hexPath(h, Game.Render.staticCtx);
    Game.Render.staticCtx.lineWidth = 0.9;
    Game.Render.staticCtx.strokeStyle = 'rgba(0,0,0,0.32)';
    Game.Render.staticCtx.stroke();
  };
  Game.Render.drawFactionBorders = function drawFactionBorders(h) {
    const color = Game.State.match.players[h.owner].color;

    Game.Render.ctx.save();

    Game.Render.ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const c = Game.Render.corner(h, i);
      if (i === 0) Game.Render.ctx.moveTo(c.x, c.y);
      else Game.Render.ctx.lineTo(c.x, c.y);
    }
    Game.Render.ctx.closePath();
    Game.Render.ctx.clip();

    const corners = [];
    for (let i = 0; i < 6; i++) {
      corners.push(Game.Render.corner(h, i));
    }

    Game.Render.ctx.lineWidth = 4 * Game.Render.camera.zoom;
    Game.Render.ctx.strokeStyle = color;
    Game.Render.ctx.lineCap = 'square'; 
    Game.Render.ctx.beginPath();

    let hasEdges = false;

    for (let i = 0; i < 6; i++) {
      const [dq, dr] = Game.Config.EDGE_DIRS[i];
      const nb = Game.State.match.hexes.get(Game.Utils.key(h.q + dq, h.r + dr));
      
      if (!nb || nb.owner !== h.owner) {
        let c1 = corners[i];
        let c2 = corners[(i + 1) % 6];

        // 4. Удлиняем каждый отрезок в обе стороны, чтобы они заходили друг за друга на углах
        const dx = c2.x - c1.x;
        const dy = c2.y - c1.y;
        const len = Math.sqrt(dx * dx + dy * dy);
        
        if (len > 0) {
          const extend = 4 * Game.Render.camera.zoom; // Запас на перекрытие стыка
          const ux = (dx / len) * extend;
          const uy = (dy / len) * extend;

          c1 = { x: c1.x - ux, y: c1.y - uy };
          c2 = { x: c2.x + ux, y: c2.y + uy };
        }

        Game.Render.ctx.moveTo(c1.x, c1.y);
        Game.Render.ctx.lineTo(c2.x, c2.y);
        hasEdges = true;
      }
    }

    if (hasEdges) {
      Game.Render.ctx.stroke();
    }

    Game.Render.ctx.restore();
  };
  Game.Render.drawCapital = function drawCapital(h){
    const p = Game.Render.pixelForHex(h);
    const color = h.owner !== null ? Game.State.match.players[h.owner].color : '#d4a24c';
    const cx = p.x, cy = p.y - p.hexSize * 0.38, r = 3.5 * p.scale;
    const img = Game.Assets.variant('capital', 'default', h);
    // ИСПРАВЛЕНО: раньше рисовалось в staticCtx (кэшированный слой террейна),
    // хотя вызывается каждый кадр из динамического Layer 2 в draw() — иконка
    // столицы из-за этого на кадр отставала от остального рендера. Теперь,
    // как и юниты, рисуется прямо в Game.Render.ctx.
    Game.Render.ctx.beginPath();
    Game.Render.ctx.arc(cx, cy, r, 0, Math.PI * 2);
    Game.Render.ctx.fillStyle = color;
    Game.Render.ctx.fill();
    Game.Render.ctx.lineWidth = 1.5;
    Game.Render.ctx.strokeStyle = '#101712';
    Game.Render.ctx.stroke();

    if(img){
      const size = r * 1.7;
      Game.Render.ctx.save();
      Game.Render.ctx.beginPath();
      Game.Render.ctx.arc(cx, cy, r, 0, Math.PI * 2);
      Game.Render.ctx.clip();
      Game.Render.ctx.drawImage(img, cx - size / 2, cy - size / 2, size, size);
      Game.Render.ctx.restore();
    }
  };
  Game.Render.drawSelected = function drawSelected(h){
    Game.Render.hexPath(h, Game.Render.ctx);
    Game.Render.ctx.lineWidth = 1.8;
    Game.Render.ctx.strokeStyle = '#f4eedb';
    Game.Render.ctx.stroke();
  };
  Game.Render.drawHovered = function drawHovered(h){
    Game.Render.hexPath(h, Game.Render.ctx);
    Game.Render.ctx.fillStyle = 'rgba(255,255,255,0.32)';
    Game.Render.ctx.fill();
  };
  Game.Render.drawFlyingUnits = function drawFlyingUnits(){
    const offX = Game.Render.canvas.dataset.offx ? parseFloat(Game.Render.canvas.dataset.offx) : 0;
    const offY = Game.Render.canvas.dataset.offy ? parseFloat(Game.Render.canvas.dataset.offy) : 0;
    const visible = Game.Render.visible;

    Game.Render.flyingUnits.forEach(fu => {
      // Чужой марш в тумане войны не показываем — виден, только если один из
      // концов пути (откуда/куда) сейчас в зоне обзора игрока.
      if(fu.owner !== 0 && visible && !visible.has(Game.Utils.key(fu.fromQ, fu.fromR)) && !visible.has(Game.Utils.key(fu.toQ, fu.toR))){
        return;
      }
      const fromP = Game.Render.toPixel(fu.fromQ, fu.fromR);
      const toP = Game.Render.toPixel(fu.toQ, fu.toR);

      // Интерполируем в ПЛОСКИХ (до наклона/перспективы) координатах — ровно
      // так же, как это делает Game.Render.cornerFlat()/Game.Render.flatCenter() для
      // статичных гексов — и лишь затем проецируем через ЕДИНУЮ
      // Game.Render.projectFlat(). Раньше здесь просто умножали на Game.Config.TILT_FACTOR и
      // игнорировали Game.Render.perspectiveScale(), поэтому летящий юнит двигался
      // по прямой, а не по той же перспективно-искажённой дуге, что рисуют
      // сами гексы — сейчас он "приезжает" точно в центр гекса-цели.
      const flatX = fromP.x + (toP.x - fromP.x) * fu.progress + offX;
      const flatY = fromP.y + (toP.y - fromP.y) * fu.progress + offY;
      const proj = Game.Render.projectFlat(flatX, flatY);
      const r = Game.Config.settings.hexSize * proj.scale;

      Game.Render.ctx.beginPath();
      Game.Render.ctx.arc(proj.x, proj.y, r * 0.38, 0, Math.PI * 2);
      Game.Render.ctx.fillStyle = Game.State.match.players[fu.owner].color;
      Game.Render.ctx.fill();
      Game.Render.ctx.lineWidth = 2;
      Game.Render.ctx.strokeStyle = '#ffffff';
      Game.Render.ctx.stroke();

      Game.Render.ctx.fillStyle = '#ffffff';
      Game.Render.ctx.font = 'bold ' + Math.max(8, Math.round(11 * proj.scale)) + 'px ' + getComputedStyle(document.body).fontFamily;
      Game.Render.ctx.textAlign = 'center';
      Game.Render.ctx.textBaseline = 'middle';
      Game.Render.ctx.fillText(fu.strength, proj.x, proj.y);
    });
  };
  Game.Render.drawDestroyingUnits = function drawDestroyingUnits(){
    const visible = Game.Render.visible;
    Game.Render.destroyingUnits.forEach(du => {
      if(du.owner !== 0 && visible && !visible.has(Game.Utils.key(du.q, du.r))) return;
      const p = Game.Render.pixelForHex(du);
      Game.Render.ctx.save();
      Game.Render.ctx.globalAlpha = Math.max(0, 1 - du.progress);
      Game.Render.ctx.beginPath();
      Game.Render.ctx.arc(p.x, p.y + p.hexSize * 0.2, p.hexSize * (0.36 + du.progress * 0.4), 0, Math.PI * 2);
      Game.Render.ctx.fillStyle = '#ef4444';
      Game.Render.ctx.fill();
      Game.Render.ctx.restore();
    });
  };
  Game.Render.updateStaticLayer = function updateStaticLayer() {
    // Статический слой (террейн/сетка/границы регионов) рисуется ОДИН РАЗ в
    // мировых координатах карты (Game.Render.mapPixelW×Game.Render.mapPixelH), а не в размере
    // полноэкранного буфера канваса — Game.Render.camera-transform в Game.Render.draw() сам
    // растягивает/двигает этот слой на экран через drawImage(Game.Render.staticCanvas).
    Game.Render.staticCanvas.width = Math.max(1, Math.ceil(Game.Render.mapPixelW));
    Game.Render.staticCanvas.height = Math.max(1, Math.ceil(Game.Render.mapPixelH));
    Game.Render.staticCtx.clearRect(0, 0, Game.Render.staticCanvas.width, Game.Render.staticCanvas.height);
    // ВАЖНО: рисуем в порядке "художника" — дальние ряды (меньший r) раньше ближних
    // (больший r), см. Game.Render.hexesByDepth(). Game.State.match.hexes.forEach() отдаёт хексы в порядке
    // вставки (по q, затем r), что раньше было не важно, но теперь картинка одного
    // гекса может специально вылезать вверх за его границы (artOverflowTop) и должна
    // ложиться ПОВЕРХ уже нарисованного дальнего соседа — иначе глубина не сработает
    // или сработает наоборот.
    Game.Render.hexesByDepth().forEach(h => {
      Game.Render.drawTerrain(h);
      if(h.regionId !== null) Game.Render.drawRegionHighlight(h);
      // Кайма карты — сплошная рамка без сетки поверх, чтобы не выглядела
      // как игровые гексы.
      if (Game.Config.settings.showGrid && h.terrain !== 'border') Game.Render.drawHexBorder(h);
    });
    Game.Render.staticDirty = false;
  };
  Game.Render.hexesByDepth = function hexesByDepth(){
    return Array.from(Game.State.match.hexes.values()).sort((a,b)=> a.r - b.r);
  };
  Game.Render.setup = function setup(){
    Game.Render.canvas = document.getElementById('board');

    if(!Game.Render.canvas) return;
    Game.Render.ctx = Game.Render.canvas.getContext('2d');

    Game.Render.staticCanvas = document.createElement('canvas');
    Game.Render.staticCtx = Game.Render.staticCanvas.getContext('2d');

    Game.Render.resize();

    Game.Render.canvas.addEventListener('pointerdown', Game.Input.onPointerDown);
    Game.Render.canvas.addEventListener('pointermove', Game.Input.onPointerMove);
    window.addEventListener('pointerup', Game.Input.onPointerUp);
    window.addEventListener('pointercancel', Game.Input.onPointerUp);

    Game.Render.canvas.addEventListener('mouseleave', ()=>{
      if(Game.Render.pointer.active.size > 0) return; // не сбрасываем hover прямо посреди drag/pinch
      Game.Render.hoveredHex = null;
      Game.UI.updateTooltip(null);
      Game.Render.draw();
    });

    Game.Render.canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const buf = Game.Render.clientToBuffer(e);
      const zoomSpeed = 1.12;
      const factor = e.deltaY > 0 ? 1 / zoomSpeed : zoomSpeed;
      Game.Render.zoomBy(factor, buf);
    }, { passive: false });

    Game.Render.initKeyboardPan();
  };
  Game.Render.resize = function resize(){
    if(!Game.Render.canvas || !Game.State.match) return;
    const hexList = Array.from(Game.State.match.hexes.values());
    const pts = hexList.map(h=>Game.Render.toPixel(h.q,h.r));
    const minX = Math.min(...pts.map(p=>p.x)) - Game.Config.settings.hexSize * 1.6;
    const maxX = Math.max(...pts.map(p=>p.x)) + Game.Config.settings.hexSize * 1.6;
    const minY = Math.min(...pts.map(p=>p.y)) - Game.Config.settings.hexSize * 1.6;
    const maxY = Math.max(...pts.map(p=>p.y)) + Game.Config.settings.hexSize * 1.6;

    Game.Render.canvas.dataset.offx = -minX;
    Game.Render.canvas.dataset.offy = -minY;

    // Мировые габариты карты (см. Game.Render.mapPixelW/Game.Render.mapPixelH) — независимы от
    // размера холста, который теперь всегда равен размеру вьюпорта.
    Game.Render.mapPixelW = maxX - minX;
    // Контент по вертикали сжимается на Game.Config.TILT_FACTOR внутри Game.Render.projectFlat,
    // поэтому и мировую высоту карты уменьшаем на тот же множитель — иначе
    // снизу остаётся пустая полоса ровно в (1 - Game.Config.TILT_FACTOR) высоты карты.
    Game.Render.mapPixelH = (maxY - minY) * Game.Config.TILT_FACTOR;

    // Диапазон плоской Y — в ТОЙ ЖЕ системе координат (offset уже применён), что и
    // Game.Render.flatCenter()/Game.Render.cornerFlat(), которыми пользуется Game.Render.projectFlat().
    const flatYs = pts.map(p => p.y - minY);
    Game.Render.perspRange.min = Math.min(...flatYs);
    Game.Render.perspRange.max = Math.max(...flatYs);
    Game.Render.perspRange.ready = true;

    // Канвас теперь — полноэкранный буфер (карта на весь экран), а не "холст
    // ровно по размеру карты": позиционирование/масштаб карты внутри него
    // задаёт Game.Render.camera-transform в Game.Render.draw(). Буфер считаем в физических пикселях
    // (devicePixelRatio, но не выше 2x — экономим память/время на очень
    // больших картах и densely-pixel экранах).
    Game.Render.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    const viewW = Game.Render.canvas.clientWidth || window.innerWidth;
    const viewH = Game.Render.canvas.clientHeight || window.innerHeight;
    Game.Render.canvas.width = Math.max(1, Math.round(viewW * Game.Render.devicePixelRatio));
    Game.Render.canvas.height = Math.max(1, Math.round(viewH * Game.Render.devicePixelRatio));

    Game.Render.staticDirty = true;
    Game.Render.fitToMap();
  };
  // Туман войны: гекс видим, если он в радиусе Game.Config.FOG_OF_WAR_RADIUS
  // от любого владения/юнита игрока-человека (id:0), либо сам ему
  // принадлежит/занят им. Кайма карты (terrain 'border') видна всегда — это
  // декоративная рамка, а не игровая территория.
  Game.Render.updateVisibility = function updateVisibility(){
    const radius = Game.Config.FOG_OF_WAR_RADIUS;
    const sources = [];
    Game.State.match.hexes.forEach(h=>{
      if(h.terrain === 'border') return;
      if(h.owner === 0 || h.occupiedBy === 0 || (h.unit && h.unit.owner === 0)) sources.push(h);
    });
    // Юнит игрока в полёте между гексами (см. animateMove) на миг никому не
    // "принадлежит" — он уже ушёл из from.unit и ещё не встал в to.unit.
    // Без этого туман на секунду откатывается в начале хода и снова
    // раскрывается в конце. Добавляем обе точки анимации как источники обзора
    // на всё время полёта — старое место видно, пока юнит летит, новое видно
    // сразу, не дожидаясь конца анимации.
    Game.Render.flyingUnits.forEach(fu=>{
      if(fu.owner !== 0) return;
      sources.push({ q: fu.fromQ, r: fu.fromR });
      sources.push({ q: fu.toQ, r: fu.toR });
    });

    const visible = new Set();
    Game.State.match.hexes.forEach(h=>{
      if(h.terrain === 'border'){ visible.add(Game.Utils.key(h.q,h.r)); return; }
      for(let i=0;i<sources.length;i++){
        if(Game.Utils.hexDist(h, sources[i]) <= radius){
          visible.add(Game.Utils.key(h.q,h.r));
          break;
        }
      }
    });
    Game.Render.visible = visible;
  };
  Game.Render.drawFog = function drawFog(h){
    Game.Render.hexPath(h, Game.Render.ctx);
    Game.Render.ctx.fillStyle = 'rgba(4, 6, 4, 0.22)';
    Game.Render.ctx.fill();
  };
  Game.Render.draw = function draw(){
    if(!Game.Render.ctx || !Game.Render.canvas) return;
    Game.Render.version++;
    Game.Render.ctx.clearRect(0,0,Game.Render.canvas.width,Game.Render.canvas.height);

    Game.Render.ctx.resetTransform();
    Game.Render.ctx.setTransform(Game.Render.camera.zoom, 0, 0, Game.Render.camera.zoom, Game.Render.camera.x, Game.Render.camera.y);

    // Layer: static (террейн/сетка/границы регионов, кэшируются в Game.Render.staticCanvas)
    if (Game.Render.staticDirty) Game.Render.updateStaticLayer();
    Game.Render.ctx.drawImage(Game.Render.staticCanvas, 0, 0);

    Game.Render.updateVisibility();
    const visible = Game.Render.visible;

    const depthOrder = Game.Render.hexesByDepth();

    // Layer 0: границы фракций, подсветка активной области, штриховка осады —
    // только на видимых гексах (под туманом войны чужие владения/осады не
    // показываем).
    depthOrder.forEach(h=>{
      if(!visible.has(Game.Utils.key(h.q, h.r))) return;
      if(h.owner !== null) Game.Render.drawFactionBorders(h) 
      if (Game.State.activeRegionId !== null) Game.Render.drawActiveRegion(h);
      if (h.occupiedBy !== null) Game.Render.drawSiegeHatch(h);
    });

    
    //Layer 1
    const hh = Game.Render.hoveredHex;
    const sh = Game.State.match.selected;

    if(hh){
      Game.Render.drawHovered(hh)
      if(hh.unit && hh.unit.owner !== 0 && visible.has(Game.Utils.key(hh.q, hh.r))) Game.Render.drawReachable(hh)
      //if(hh.unit && Game.Config.settings.zocEnabled) Game.Render.drawZoc(hh)
    }
    if(sh){
      Game.Render.drawSelected(sh)
      if(sh.unit && sh.unit.owner===0 && !Game.State.match.over) Game.Render.drawPlayerReachable(sh)
    }
    //Layer 2 — юниты/столицы тоже скрыты в тумане войны
    depthOrder.forEach(h => {
      if(!visible.has(Game.Utils.key(h.q, h.r))) return;
      if (h.unit) Game.Render.drawUnit(h);
      if(h.capital) Game.Render.drawCapital(h);
    });
    // Layer fog: затемняем всё, что вне тумана войны — поверх границ/штриховки,
    // но под юнитами (юниты там всё равно не рисуются, см. Layer 2).
    depthOrder.forEach(h=>{
      if(!visible.has(Game.Utils.key(h.q, h.r))) Game.Render.drawFog(h);
    });


    Game.Render.drawFlyingUnits();
    Game.Render.drawDestroyingUnits();
    Game.Render.ctx.resetTransform();
  };
  Game.Render.animateMove = function animateMove(from, to, unitData, callback){
    Game.Render.flyingUnits.push({
      fromQ: from.q, fromR: from.r,
      toQ: to.q, toR: to.r,
      owner: unitData.owner,
      strength: unitData.strength,
      progress: 0,
    });
    
    const startTime = performance.now();
    const duration = 280;

    function animateStep(currentTime){
      const elapsed = currentTime - startTime;
      const p = Math.min(1, elapsed / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      
      if(Game.Render.flyingUnits.length > 0) Game.Render.flyingUnits[Game.Render.flyingUnits.length - 1].progress = eased;
      Game.Render.draw();

      if(p < 1){
        requestAnimationFrame(animateStep);
      } else {
        Game.Render.flyingUnits.pop();
        if(callback) callback();
      }
    }
    requestAnimationFrame(animateStep);
  };
  Game.Render.animateDestruction = function animateDestruction(hex, unitData, callback){
    Game.Render.destroyingUnits.push({
      q: hex.q, r: hex.r,
      owner: unitData.owner,
      strength: unitData.strength,
      progress: 0
    });

    const startTime = performance.now();
    const duration = 380;

    function animateStep(currentTime){
      const elapsed = currentTime - startTime;
      const p = Math.min(1, elapsed / duration);
      
      if(Game.Render.destroyingUnits.length > 0) Game.Render.destroyingUnits[Game.Render.destroyingUnits.length - 1].progress = p;
      Game.Render.draw();

      if(p < 1){
        requestAnimationFrame(animateStep);
      } else {
        Game.Render.destroyingUnits.pop();
        if(callback) callback();
      }
    }
    requestAnimationFrame(animateStep);
  };
  Game.Render.clientToBuffer = function clientToBuffer(evt){
    const rect = Game.Render.canvas.getBoundingClientRect();
    const scaleX = Game.Render.canvas.width / rect.width;
    const scaleY = Game.Render.canvas.height / rect.height;
    return {
      x: (evt.clientX - rect.left) * scaleX,
      y: (evt.clientY - rect.top) * scaleY
    };
  };
  Game.Render.bufferToWorld = function bufferToWorld(pt){
    return { x: (pt.x - Game.Render.camera.x) / Game.Render.camera.zoom, y: (pt.y - Game.Render.camera.y) / Game.Render.camera.zoom };
  };
  Game.Render.clampCamera = function clampCamera(){
    if(!Game.Render.canvas || !Game.Render.mapPixelW || !Game.Render.mapPixelH) return;
    const mapW = Game.Render.mapPixelW * Game.Render.camera.zoom, mapH = Game.Render.mapPixelH * Game.Render.camera.zoom;
    const padX = Math.min(Game.Render.canvas.width * 0.4, 320);
    const padY = Math.min(Game.Render.canvas.height * 0.4, 320);
    let minX = Game.Render.canvas.width - mapW - padX, maxX = padX;
    if(minX > maxX){ const mid = (minX + maxX) / 2; minX = maxX = mid; }
    Game.Render.camera.x = Game.Utils.clamp(Game.Render.camera.x, minX, maxX);
    let minY = Game.Render.canvas.height - mapH - padY, maxY = padY;
    if(minY > maxY){ const mid = (minY + maxY) / 2; minY = maxY = mid; }
    Game.Render.camera.y = Game.Utils.clamp(Game.Render.camera.y, minY, maxY);
  };
  Game.Render.zoomBy = function zoomBy(factor, anchorBuffer){
    if(!Game.Render.canvas) return;
    const anchor = anchorBuffer || { x: Game.Render.canvas.width / 2, y: Game.Render.canvas.height / 2 };
    const oldZoom = Game.Render.camera.zoom;
    const newZoom = Game.Utils.clamp(oldZoom * factor, Game.Config.MIN_ZOOM, Game.Config.MAX_ZOOM);
    if(newZoom === oldZoom) return;
    Game.Render.camera.x = anchor.x - (anchor.x - Game.Render.camera.x) * (newZoom / oldZoom);
    Game.Render.camera.y = anchor.y - (anchor.y - Game.Render.camera.y) * (newZoom / oldZoom);
    Game.Render.camera.zoom = newZoom;
    Game.Render.clampCamera();
    Game.Render.draw();
  };
  Game.Render.fitToMap = function fitToMap(){
    if(!Game.Render.canvas || !Game.Render.mapPixelW || !Game.Render.mapPixelH) return;
    const margin = 0.92;
    const z = Game.Utils.clamp(Math.min(Game.Render.canvas.width / Game.Render.mapPixelW, Game.Render.canvas.height / Game.Render.mapPixelH) * margin, Game.Config.MIN_ZOOM, Game.Config.MAX_ZOOM);
    Game.Render.camera.zoom = z;
    Game.Render.camera.x = (Game.Render.canvas.width - Game.Render.mapPixelW * z) / 2;
    Game.Render.camera.y = (Game.Render.canvas.height - Game.Render.mapPixelH * z) / 2;
  };
  Game.Render.pointerDist = function pointerDist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); };
  Game.Render.keyPanStep = function keyPanStep(){
    if(Game.Render.pan.keys.size === 0){ Game.Render.pan.rafId = null; return; }
    let dx = 0, dy = 0;
    Game.Render.pan.keys.forEach(k => { const v = Game.Config.PAN_KEY_MAP[k]; if(v){ dx += v[0]; dy += v[1]; } });
    if(dx || dy){
      const len = Math.hypot(dx, dy) || 1;
      const speed = 14 / Game.Render.camera.zoom * (Game.Render.canvas ? Game.Render.canvas.width / 1200 + 0.6 : 1);
      Game.Render.camera.x -= (dx / len) * speed;
      Game.Render.camera.y -= (dy / len) * speed;
      Game.Render.clampCamera();
      Game.Render.draw();
    }
    Game.Render.pan.rafId = requestAnimationFrame(Game.Render.keyPanStep);
  };
  Game.Render.initKeyboardPan = function initKeyboardPan(){
    window.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName || '').toLowerCase();
      if(tag === 'input' || tag === 'select' || tag === 'textarea') return;
      const k = e.key.toLowerCase();
      if(!Game.Config.PAN_KEY_MAP[k]) return;
      Game.Render.pan.keys.add(k);
      if(Game.Render.pan.rafId === null) Game.Render.pan.rafId = requestAnimationFrame(Game.Render.keyPanStep);
    });
    window.addEventListener('keyup', (e) => { Game.Render.pan.keys.delete(e.key.toLowerCase()); });
    window.addEventListener('blur', () => { Game.Render.pan.keys.clear(); });
  };

  // ==========================================================================
  // Game.Input — pointer / touch / keyboard handling and hex selection
  // ==========================================================================
  Game.Input = {};
  Game.Input.selectHex = function selectHex(h){
    if(Game.State.match.over) return;
    if(h && h.terrain === 'border') return; // кайма карты не кликабельна
    Game.Audio.play('click');
    const prevSelected = Game.State.match.selected;

    if(prevSelected === h && h && h.capital && h.unit && h.unit.owner === 0){
      h.unitHasFocus = !h.unitHasFocus;
      Game.State.activeRegionId = h.unitHasFocus ? null : h.regionId;
      Game.Render.draw(); Game.UI.updatePanel();
      return;
    }

    if(prevSelected && prevSelected.unit && prevSelected.unit.owner === 0 && !prevSelected.unit.hasMoved && prevSelected !== h){
      const isArmyFocused = !prevSelected.capital || prevSelected.unitHasFocus;
      if (isArmyFocused) {
        const reachable = Game.Movement.reachable(prevSelected, 0);
        if(reachable.has(Game.Utils.key(h.q, h.r))){
          Game.Combat.moveOrAttack(prevSelected, h, 0, false, (result)=>{
            if(result === 'captured'){
              Game.UI.log(`Победа в бою на (${h.q}, ${h.r})! Враг разбит.`);
            } else if(result === 'raided'){
              Game.UI.log(`Рейд на (${h.q}, ${h.r}) удался — враг разбит.`);
            } else if(result === 'lost'){
              Game.UI.log(`Атака на (${h.q}, ${h.r}) провалилась. Наш отряд уничтожен.`);
            } else if(result === 'merged'){
              Game.UI.log(`Отряды объединены на (${h.q}, ${h.r}).`);
            } else if(result === 'neutral_siege'){
              Game.UI.log(`Отряд вошел в нейтральную область (${h.q}, ${h.r}). Захват завершится на следующий ход.`);
            } else if(result === 'occupied'){
              Game.UI.log(`Отряд начал ОСАДУ вражеской СТОЛИЦЫ (${h.q}, ${h.r}).`);
            }
            Game.State.match.selected = null;
            Game.State.activeRegionId = null;
            Game.Render.draw(); Game.UI.updatePanel(); Game.Turns.checkGameOver();
          });
          Game.State.match.selected = null;
          Game.State.activeRegionId = null;
          Game.Render.draw(); Game.UI.updatePanel();
          return;
        }
      }
    }

    if(h && h.capital && h.unit && h.unit.owner === 0){
      Game.State.match.selected = h;
      h.unitHasFocus = false;
      Game.State.activeRegionId = h.regionId;
      Game.Render.draw(); Game.UI.updatePanel();
      return;
    }

    if(h && h.unit && h.unit.owner === 0){
      Game.State.match.selected = h;
      h.unitHasFocus = true;
      Game.State.activeRegionId = null;
      Game.Render.draw(); Game.UI.updatePanel();
      return;
    }

    if(h && h.capital && h.owner === 0){
      if(prevSelected === h){
        Game.State.match.selected = null;
        Game.State.activeRegionId = null;
      } else {
        Game.State.match.selected = h;
        Game.State.activeRegionId = h.regionId;
      }
      Game.Render.draw(); Game.UI.updatePanel();
      return;
    }

    if(prevSelected === h){
      Game.State.match.selected = null;
      Game.State.activeRegionId = null;
    } else {
      Game.State.match.selected = h;
      Game.State.activeRegionId = h ? h.regionId : null;
    }
    Game.Render.draw(); Game.UI.updatePanel();
  };
  Game.Input.onHover = function onHover(evt){
    const h = Game.Render.hexAtEvent(evt);
    if(h === Game.Render.lastHover.hex && Game.Render.version === Game.Render.lastHover.version) return;
    
    Game.Render.hoveredHex = h;
    Game.UI.updateTooltip(h);
    Game.Render.draw();
    Game.Render.lastHover.hex = h; Game.Render.lastHover.version = Game.Render.version;
  };
  Game.Input.onPointerDown = function onPointerDown(evt){
    Game.Render.canvas.setPointerCapture(evt.pointerId);
    Game.Render.pointer.active.set(evt.pointerId, { x: evt.clientX, y: evt.clientY });

    if(Game.Render.pointer.active.size === 1){
      Game.Render.pointer.isPanning = true;
      Game.Render.pointer.didDrag = false;
      Game.Render.pointer.panStartBuffer = Game.Render.clientToBuffer(evt);
      Game.Render.pointer.panStartCamera = { x: Game.Render.camera.x, y: Game.Render.camera.y };
      Game.Render.pointer.panStartClient = { x: evt.clientX, y: evt.clientY };
    } else if(Game.Render.pointer.active.size === 2){
      Game.Render.pointer.isPanning = false;
      const pts = Array.from(Game.Render.pointer.active.values());
      Game.Render.pointer.pinchStartDist = Game.Render.pointerDist(pts[0], pts[1]) || 1;
      Game.Render.pointer.pinchStartZoom = Game.Render.camera.zoom;
      Game.Render.pointer.pinchStartCamera = { x: Game.Render.camera.x, y: Game.Render.camera.y };
      Game.Render.pointer.pinchStartMid = Game.Render.clientToBuffer({ clientX: (pts[0].x + pts[1].x) / 2, clientY: (pts[0].y + pts[1].y) / 2 });
    }
  };
  Game.Input.onPointerMove = function onPointerMove(evt){
    if(!Game.Render.pointer.active.has(evt.pointerId)){
      Game.Input.onHover(evt);
      return;
    }
    Game.Render.pointer.active.set(evt.pointerId, { x: evt.clientX, y: evt.clientY });

    if(Game.Render.pointer.active.size >= 2){
      const pts = Array.from(Game.Render.pointer.active.values());
      const dist = Game.Render.pointerDist(pts[0], pts[1]) || 1;
      const newZoom = Game.Utils.clamp(Game.Render.pointer.pinchStartZoom * (dist / Game.Render.pointer.pinchStartDist), Game.Config.MIN_ZOOM, Game.Config.MAX_ZOOM);
      Game.Render.camera.x = Game.Render.pointer.pinchStartMid.x - (Game.Render.pointer.pinchStartMid.x - Game.Render.pointer.pinchStartCamera.x) * (newZoom / Game.Render.pointer.pinchStartZoom);
      Game.Render.camera.y = Game.Render.pointer.pinchStartMid.y - (Game.Render.pointer.pinchStartMid.y - Game.Render.pointer.pinchStartCamera.y) * (newZoom / Game.Render.pointer.pinchStartZoom);
      Game.Render.camera.zoom = newZoom;
      Game.Render.clampCamera();
      Game.Render.draw();
      return;
    }

    if(Game.Render.pointer.isPanning && Game.Render.pointer.panStartBuffer){
      if(!Game.Render.pointer.didDrag && Math.hypot(evt.clientX - Game.Render.pointer.panStartClient.x, evt.clientY - Game.Render.pointer.panStartClient.y) > 4){
        Game.Render.pointer.didDrag = true;
        Game.Render.canvas.classList.add('dragging');
      }
      if(Game.Render.pointer.didDrag){
        const buf = Game.Render.clientToBuffer(evt);
        Game.Render.camera.x = Game.Render.pointer.panStartCamera.x + (buf.x - Game.Render.pointer.panStartBuffer.x);
        Game.Render.camera.y = Game.Render.pointer.panStartCamera.y + (buf.y - Game.Render.pointer.panStartBuffer.y);
        Game.Render.clampCamera();
        Game.Render.hoveredHex = null;
        Game.Render.draw();
      }
    }
  };
  Game.Input.onPointerUp = function onPointerUp(evt){
    const wasPanning = Game.Render.pointer.isPanning && Game.Render.pointer.active.has(evt.pointerId);
    Game.Render.pointer.active.delete(evt.pointerId);

    if(Game.Render.pointer.active.size === 0){
      Game.Render.canvas.classList.remove('dragging');
      if(wasPanning && !Game.Render.pointer.didDrag){
        const h = Game.Render.hexAtEvent(evt);
        if(h) Game.Input.selectHex(h);
      }
      Game.Render.pointer.isPanning = false;
      Game.Render.pointer.panStartBuffer = null;
      Game.Render.pointer.didDrag = false;
    } else if(Game.Render.pointer.active.size === 1){
      // Отпустили один из двух пальцев при щипке — переходим обратно в pan
      // от оставшегося пальца, без "скачка" камеры.
      const [remaining] = Game.Render.pointer.active.values();
      Game.Render.pointer.isPanning = true;
      Game.Render.pointer.didDrag = true;
      Game.Render.pointer.panStartBuffer = Game.Render.clientToBuffer({ clientX: remaining.x, clientY: remaining.y });
      Game.Render.pointer.panStartCamera = { x: Game.Render.camera.x, y: Game.Render.camera.y };
      Game.Render.pointer.panStartClient = { x: remaining.x, y: remaining.y };
    }
  };

  // ==========================================================================
  // Game.UI — DOM panel/tooltip/legend/log rendering + control wiring
  // ==========================================================================
  Game.UI = {};
  Game.UI.updatePanel = function updatePanel(){
    const pList = document.getElementById('playerList');
    if(pList){
      pList.innerHTML = Game.State.match.players.map(p => {
        const stats = Game.Map.incomeAndUpkeep(p.id);
        return `
        <div class="playerRow ${!p.alive ? 'dead' : ''} ${p.id===0 ? 'activePlayer' : ''}">
          <div class="swatch" style="background:${p.color}"></div>
          <div class="playerName">${p.name} <span style="font-size:10px; color:var(--text-muted); display:block;">Доход: +${stats.income} | Расх: -${stats.upkeep}</span></div>
          <div class="playerGold">${p.gold}💰 (${(stats.income - stats.upkeep)})</div>
          <div class="playerHexes">${Game.Map.ownedHexCount(p.id)} г.</div>
        </div>
      `;
      }).join('');
    }

    const info = document.getElementById('selectedInfo');
    const acts = document.getElementById('actionButtons');
    if(!info || !acts) return;

    const sel = Game.State.match.selected;
    if(!sel){
      info.innerHTML = '<span class="placeholder">Выберите гекс для отдачи приказов</span>';
      acts.innerHTML = '';
      return;
    }

    const TERRAIN = Game.Config.terrainDefs();
    const t = TERRAIN[sel.terrain];
    let html = `<b>${t.label}</b> (q:${sel.q}, r:${sel.r})`;
    if(sel.owner!==null) html += `<br>Владелец: ${Game.State.match.players[sel.owner].name}`;
    if(sel.capital) html += `<br><span style="color:var(--gold);">👑 Столица области #${sel.regionId}</span>`;
    
    let actHtml = '';
    if(sel.unit){
      html += `<br><span style="color:#60a5fa;">🛡️ Отряд фракции ${Game.State.match.players[sel.unit.owner].name} (сила: ${sel.unit.strength})</span>`;
    }
    info.innerHTML = html;

    const regionIsOccupied = Game.Map.isRegionOccupiedBy(sel.regionId, 0);

    if(sel.capital && sel.unit && sel.unit.owner === 0){
      actHtml += `<div style="background:rgba(212,162,76,0.08); border:1px solid var(--gold-dim); padding:8px; border-radius:4px; margin-bottom:8px;">
        <div style="font-size:11px; color:var(--gold); margin-bottom:6px; font-weight:bold; text-transform:uppercase;">Выбрать объект на гексе:</div>
        <div style="display:flex; gap:6px;">
          <button id="selectCapitalBtn" type="button" style="margin-top:0; flex:1; font-size:11px; background:${!sel.unitHasFocus ? 'var(--gold)' : 'transparent'}; color:${!sel.unitHasFocus ? '#1b1305' : 'var(--gold)'};">Столица</button>
          <button id="selectArmyBtn" type="button" style="margin-top:0; flex:1; font-size:11px; background:${sel.unitHasFocus ? 'var(--gold)' : 'transparent'}; color:${sel.unitHasFocus ? '#1b1305' : 'var(--gold)'};">Войска</button>
        </div>
      </div>`;
    } else if(sel.capital && sel.unit && sel.unit.owner !== 0){
      actHtml += `<div style="font-size:11px; color:var(--text-muted); margin-bottom:6px;">Столица занята вражеским отрядом.</div>`;
    }

    const isCapitalFocused = sel.capital && sel.owner === 0 && (!sel.unit || !sel.unitHasFocus);
    if(isCapitalFocused && !Game.State.match.over && sel.occupiedBy === null && !sel.unit){
      if(regionIsOccupied){
        actHtml += `<div style="font-size:11px; color:var(--danger); margin-top:6px; margin-bottom:6px;">⚠️ Область оккупирована! Найм войск заблокирован.</div>`;
      } else {
        actHtml += `<button id="recruitBtn" type="button">Найнять отряд (${Game.Config.RECRUIT_COST}💰)</button>`;
      }
    }
    
    const isUnitInCapital = sel.capital && sel.unit && sel.unit.owner === 0 && sel.owner === 0;
    if(isUnitInCapital && !Game.State.match.over && Game.State.match.players[0].gold >= Game.Config.REINFORCE_COST){
      if(regionIsOccupied){
        actHtml += `<div style="font-size:11px; color:var(--danger); margin-top:6px; margin-bottom:6px;">⚠️ Текущая область оккупирована! Усиление войск заблокировано.</div>`;
      } else {
        actHtml += `<button id="reinforceBtn" type="button">Усилить отряд (${Game.Config.REINFORCE_COST}💰)</button>`;
      }
    }
    acts.innerHTML = actHtml;

    const selCapBtn = document.getElementById('selectCapitalBtn');
    if(selCapBtn){
      selCapBtn.onclick = (e) => {
        e.stopPropagation();
        sel.unitHasFocus = false;
        Game.State.activeRegionId = sel.regionId;
        Game.Render.draw(); Game.UI.updatePanel();
      };
    }

    const selArmyBtn = document.getElementById('selectArmyBtn');
    if(selArmyBtn){
      selArmyBtn.onclick = (e) => {
        e.stopPropagation();
        sel.unitHasFocus = true;
        Game.State.activeRegionId = null;
        Game.Render.draw(); Game.UI.updatePanel();
      };
    }

    const recBtn = document.getElementById('recruitBtn');
    if(recBtn){
      recBtn.onclick = (e)=>{
        e.stopPropagation();
        if(Game.State.match.players[0].gold >= Game.Config.RECRUIT_COST && !sel.unit && !Game.Map.isRegionOccupiedBy(sel.regionId, 0)){
          Game.State.match.players[0].gold -= Game.Config.RECRUIT_COST;
          sel.unit = { owner: 0, strength: 1, hasMoved: true };
          Game.Audio.play('recruit');
          Game.UI.log(`Найман новый отряд на (${sel.q}, ${sel.r}) [ожидает следующего хода для движения].`);
          Game.Render.draw(); Game.UI.updatePanel();
        }
      };
    }

    const reinBtn = document.getElementById('reinforceBtn');
    if(reinBtn){
      reinBtn.onclick = (e)=>{
        e.stopPropagation();
        if(Game.State.match.players[0].gold >= Game.Config.REINFORCE_COST && sel.unit && sel.unit.owner===0 && !Game.Map.isRegionOccupiedBy(sel.regionId, 0)){
          Game.State.match.players[0].gold -= Game.Config.REINFORCE_COST;
          sel.unit.strength += 1;
          Game.Audio.play('recruit');
          Game.UI.log(`Отряд на (${sel.q}, ${sel.r}) усилен.`);
          Game.Render.draw(); Game.UI.updatePanel();
        }
      };
    }
  };
  Game.UI.updateTooltip = function updateTooltip(h){
    const tip = document.getElementById('fixedTooltip');
    if(!tip) return;
    if(!h){
      tip.innerHTML = '<span style="color:var(--text-muted)">Наведите или выберите гекс для информации...</span>';
      return;
    }

    const TERRAIN = Game.Config.terrainDefs();
    const t = TERRAIN[h.terrain];
    let txt = t.impassable ? `<b>${t.label}</b>` : `<b>${t.label}</b> · Доход: ${h.occupiedBy!==null?0:t.yield}💰`;
    if(h.owner!==null) txt += ` · Владелец: ${Game.State.match.players[h.owner].name}`;
    if(h.occupiedBy!==null) txt += h.capital
      ? ` <br><span style="color:#e2b753;">👑 ОСАДА СТОЛИЦЫ: ${Game.State.match.players[h.occupiedBy].name}</span>`
      : ` <br><span style="color:#e2b753;">⚔️ РЕЙД: ${Game.State.match.players[h.occupiedBy].name}</span>`;
    if(h.capital) txt += ' <br>👑 СТОЛИЦА ОБЛАСТИ';
    
    if(h.unit){
      const supp = Game.Combat.adjacentSupport(h, h.unit.owner);
      txt += ` <br>🛡️ Отряд: сила ${h.unit.strength}${supp>0?` (+${supp} поддержка = ${h.unit.strength+supp})`:''}`;
      if(h.unit.hasMoved) txt += ' [ход завершён]';
    }

    const sel = Game.State.match.selected;
    if(sel && sel.unit && sel.unit.owner===0 && !sel.unit.hasMoved && sel!==h && !t.impassable){
      const reachable = Game.Movement.reachableCached(sel, 0);
      if(reachable.has(Game.Utils.key(h.q, h.r))){
        const attData = Game.Combat.attackerData(sel, h, 0);
        const defData = Game.Combat.defenderData(h, sel, h.unit ? h.unit.owner : (h.owner !== null ? h.owner : null));
        const win = attData.total > defData.total;
        
        txt += ` | <b style="color:${win?'#86efac':'#fca5a5'};">Атака: ${win?'ПОБЕДА':'ПОРАЖЕНИЕ'}</b><br>`;
        txt += `<span style="font-size:11px; color:var(--text-muted);">⚔️ Атк: ${attData.base} база`;
        if(attData.support > 0) txt += ` + ${attData.support} поддержка`;
        txt += ` = <b>${attData.total}</b> | 🛡️ Защ: ${defData.base} база`;
        if(defData.defBonus > 0) txt += ` + ${defData.defBonus} местность/столица`;
        if(defData.support > 0) txt += ` + ${defData.support} поддержка`;
        txt += ` = <b>${defData.total}</b></span>`;
      }
    }
    tip.innerHTML = txt;
  };

    `;
  };
  // Плашка "сейчас ходит..." сверху экрана, пока идёт ход ИИ-фракции (см.
  // Game.AI.runTurnSequence()) — как баннер смены хода в Total War.
  Game.UI.showAiTurnBanner = function showAiTurnBanner(player){
    const el = document.getElementById('aiTurnBanner');
    if(!el || !player) return;
    el.querySelector('.swatch').style.background = player.color;
    el.querySelector('.label').textContent = `Ходит: ${player.name}`;
    el.classList.add('visible');
  };
  Game.UI.hideAiTurnBanner = function hideAiTurnBanner(){
    const el = document.getElementById('aiTurnBanner');
    if(!el) return;
    el.classList.remove('visible');
  };
  Game.UI.log = function log(text){
    if(!Game.State.match) return;
    Game.State.match.log.push(text);
    if(Game.State.match.log.length>60) Game.State.match.log.shift();
    const el = document.getElementById('log');
    if(el) {
      el.innerHTML = Game.State.match.log.slice().reverse().map(m=>`<div>${m}</div>`).join('');
    }
  };
  Game.UI.initEvents = function initEvents(){
    document.getElementById('newGameBtn').onclick = () => {
      Game.Map.create(Date.now());
      Game.Render.resize();
      Game.Render.draw();
      Game.UI.updatePanel();
    };
    document.getElementById('panelToggle').onclick = () => {
      document.getElementById('panel').classList.toggle("visible");
    };

    document.getElementById('zoomInBtn').onclick = () => Game.Render.zoomBy(1.25);
    document.getElementById('zoomOutBtn').onclick = () => Game.Render.zoomBy(0.8);
    document.getElementById('centerViewBtn').onclick = () => { Game.Render.fitToMap(); Game.Render.draw(); };

    document.getElementById('restartBtn').onclick = () => {
      document.getElementById('overlay').style.display='none';
      Game.Map.create(Date.now());
      Game.Render.resize();
      Game.Render.draw();
      Game.UI.updatePanel();
    };

    document.getElementById('audioToggleBtn').onclick = () => {
      const enabled = Game.Audio.toggle();
      document.getElementById('audioToggleBtn').textContent = enabled ? '🔊 Звук' : '🔇 Звук выкл';
    };

    document.getElementById('endTurnBtn').onclick = () => {
      if(Game.State.match.over || Game.State.isAiRunning) return;
      Game.State.match.selected = null;
      Game.State.activeRegionId = null;
      Game.AI.runTurnSequence();
    };

    document.getElementById('mapSizeSelect').onchange = (e) => {
      Game.Config.settings.mapRadius = parseInt(e.target.value);
      Game.Map.create(Date.now());
      Game.Render.resize();
      Game.Render.draw();
      Game.UI.updatePanel();
    };

    document.getElementById('regionSizeSelect').onchange = (e) => {
      Game.Config.settings.regionSizeMode = e.target.value;
      Game.Map.create(Date.now());
      Game.Render.resize();
      Game.Render.draw();
      Game.UI.updatePanel();
    };

    document.getElementById('moveRangeSelect').onchange = (e) => {
      Game.Config.settings.maxMovementPoints = parseInt(e.target.value);
      Game.Render.draw();
    };

    document.getElementById('hexSizeRange').oninput = (e) => {
      Game.Config.settings.hexSize = parseInt(e.target.value);
      Game.Render.resize();
      Game.Render.draw();
    };

    document.getElementById('gridToggleCheck').onchange = (e) => {
      Game.Config.settings.showGrid = e.target.checked;
      Game.Render.staticDirty = true;
      Game.Render.draw();
    };

    document.getElementById('territoryFillCheck').onchange = (e) => {
      Game.Config.settings.territoryFillMode = e.target.checked;
      Game.Render.staticDirty = true;
      Game.Render.draw();
    };

    document.getElementById('factionsCountSelect').onchange = (e) => {
      Game.Config.settings.factionsCount = parseInt(e.target.value);
      Game.Map.create(Date.now());
      Game.Render.resize();
      Game.Render.draw();
      Game.UI.updatePanel();
    };

    document.getElementById('themeSelect').onchange = (e) => {
      Game.Config.settings.currentTheme = e.target.value;
      Game.Render.draw();
    }; 

    document.getElementById('zocSelect').onchange = (e) => {
      Game.Config.settings.zocEnabled = (e.target.value === 'on');
      Game.Render.draw();
    };

    let _resizeDebounce = null;
    window.addEventListener('resize', () => {
      clearTimeout(_resizeDebounce);
      _resizeDebounce = setTimeout(() => {
        Game.Render.resize();
        Game.Render.draw();
      }, 80);
    });
  };

  // ==========================================================================
  // Bootstrap
  // ==========================================================================
  window.onload = function(){
    Game.Config.loadAssets(() => {
      Game.UI.initEvents();
      Game.Map.create(12345);
      Game.Render.setup();
      Game.Render.draw();
      Game.UI.updatePanel();
    });
  };

})();
</script>
</body>
</html>
